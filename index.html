<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fashion Frenzy">
<meta name="theme-color" content="#3f5c4a">
<title>Fashion Frenzy</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:title" content="Fashion Frenzy">
<meta property="og:type" content="website">
<meta property="og:image" content="favicon.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Fashion Frenzy">
<meta name="twitter:image" content="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Special+Elite&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#EDE6D8;
    --paper:#FBF7EE;
    --ink:#2B2620;
    --thread-red:#B23A48;
    --thread-green:#3E6259;
    --brass:#B8892B;
    --line:#c9bfa9;
    --line-soft:#ddd4bf;
    --good:#3E6259;
    --bad:#B23A48;
    --shadow: 0 2px 0 rgba(43,38,32,0.08), 0 6px 16px rgba(43,38,32,0.16);
    --display:'Playfair Display', Georgia, 'Times New Roman', serif;
    --tag:'Special Elite', 'Courier New', Courier, monospace;
    --body:'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    background:var(--ink);
    color:var(--ink);
    font-family:var(--body);
    height:100%;
    overscroll-behavior:none;
  }
  button{ font-family:var(--body); color:inherit; }

  #game{
    position:relative;
    width:100%; height:100%;
    max-width:560px; margin:0 auto;
    background:var(--canvas);
    display:flex; flex-direction:column;
    overflow:hidden;
  }

  /* ---------------- HUD ---------------- */
  #hud{
    flex:0 0 auto;
    background:var(--paper);
    border-bottom:1px solid var(--ink);
    padding:calc(var(--safe-top) + 8px) 12px 8px;
    z-index:20;
  }
  .hud-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .hud-title{ font-family:var(--display); font-weight:800; font-size:19px; line-height:1; }
  .hud-title span{ display:block; font-family:var(--tag); font-size:9px; color:#8a8069; letter-spacing:0.06em; margin-top:3px; text-transform:uppercase; }
  .hamburger{
    width:40px; height:40px; flex:0 0 40px; border:1px solid var(--ink); border-radius:9px;
    background:var(--canvas); cursor:pointer; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px; padding:0;
  }
  .hamburger i{ display:block; width:18px; height:2px; background:var(--ink); }
  .hud-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px; }
  .stat{ background:#fff; border:1px solid var(--line); border-radius:7px; padding:5px 4px; text-align:center; }
  .stat .k{ font-family:var(--tag); font-size:8px; text-transform:uppercase; color:#8a8069; letter-spacing:0.04em; }
  .stat .v{ font-family:var(--display); font-weight:700; font-size:14px; margin-top:1px; white-space:nowrap; }
  .stat.cash .v{ color:var(--thread-green); }
  .stat.rep .v{ color:var(--brass); font-size:12px; letter-spacing:-1px; }
  .stat.clockstat .v{ font-size:12px; letter-spacing:-0.2px; }
  @media (max-width:360px){
    .hud-stats{ gap:4px; }
    .stat{ padding:5px 2px; }
    .stat .v{ font-size:12px; }
    .stat.clockstat .v{ font-size:11px; }
  }

  /* ---------------- Scene ---------------- */
  #scene{
    flex:1 1 auto; position:relative; overflow:hidden; background:#3f5c4a; min-height:0;
  }
  /* Stage keeps the image's exact aspect ratio, so hotspots positioned in %
     always land on the same artwork features no matter the screen size. */
  #scene-stage{ position:relative; width:100%; margin:0 auto; padding-top:179.082%; }
  #scene-img{
    position:absolute; left:0; top:0; width:100%; height:100%;
    display:block; user-select:none; -webkit-user-drag:none; pointer-events:none;
  }
  .hotspot{
    position:absolute; border:2px dashed rgba(251,247,238,0.0); border-radius:10px;
    cursor:pointer; padding:0; background:transparent;
    display:flex; align-items:flex-end; justify-content:center;
    transition:border-color 0.18s ease, background 0.18s ease;
  }
  .hotspot:hover, .hotspot:active{ border-color:rgba(251,247,238,0.9); background:rgba(251,247,238,0.14); }
  .hotspot .hs-label{
    position:relative;
    font-family:var(--tag); font-size:10px; color:var(--ink);
    background:rgba(251,247,238,0.92); border:1px solid var(--ink); border-radius:20px;
    padding:3px 10px; margin-bottom:-11px; white-space:nowrap; box-shadow:var(--shadow);
  }
  .hotspot .hs-badge{
    position:absolute; top:-9px; right:-7px; min-width:20px; height:20px; border-radius:10px;
    background:var(--thread-red); color:#fff; font-family:var(--tag); font-size:11px;
    display:flex; align-items:center; justify-content:center; padding:0 5px; border:1px solid var(--ink);
  }

  .clock-badge{
    position:absolute; top:10px; left:10px; z-index:5;
    background:rgba(251,247,238,0.94); border:1px solid var(--ink); border-radius:9px;
    padding:6px 11px; box-shadow:var(--shadow); text-align:left;
  }
  .clock-badge .day{ font-family:var(--tag); font-size:9px; text-transform:uppercase; color:#8a8069; letter-spacing:0.05em; }
  .clock-badge .time{ font-family:var(--display); font-weight:800; font-size:17px; line-height:1.1; }
  .clock-badge .status{ font-family:var(--tag); font-size:9px; margin-top:1px; }
  .clock-badge .status.open{ color:var(--good); }
  .clock-badge .status.closed{ color:var(--bad); }
  .clock-bar{ margin-top:5px; height:4px; border-radius:3px; background:var(--canvas); border:1px solid var(--line-soft); overflow:hidden; }
  .clock-bar i{ display:block; height:100%; background:var(--brass); }

  .open-veil{
    position:absolute; inset:0; z-index:8; background:rgba(43,38,32,0.55);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:20px;
  }
  .open-card{
    background:var(--paper); border:1px solid var(--ink); border-radius:14px; box-shadow:var(--shadow);
    padding:22px 24px; text-align:center; max-width:300px; width:100%;
  }
  .open-card h3{ font-family:var(--display); font-size:22px; margin:0 0 4px; }
  .open-card p{ font-size:13px; color:#4a4438; margin:0 0 16px; line-height:1.5; }

  /* ---------------- Ticket tray ---------------- */
  #tray{
    flex:0 0 auto; background:var(--paper); border-top:1px solid var(--ink);
    padding:9px 10px calc(var(--safe-bot) + 9px);
    min-height:104px; z-index:15;
  }
  .tray-head{ font-family:var(--tag); font-size:9px; text-transform:uppercase; color:#8a8069; text-align:center; margin-bottom:7px; letter-spacing:0.06em; }
  .tray-scroll{ display:flex; gap:8px; overflow-x:auto; padding-bottom:3px; justify-content:flex-start; }
  .tray-scroll.center{ justify-content:center; }
  .order-ticket{
    flex:0 0 auto; min-width:132px; max-width:180px; background:#fff; border:1px solid var(--ink);
    border-radius:8px; padding:9px 11px 10px; cursor:pointer; text-align:left; position:relative;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .order-ticket::before{
    content:""; position:absolute; left:0; right:0; top:0; height:4px;
    background:repeating-linear-gradient(90deg, var(--thread-red) 0 8px, #fff 8px 13px);
  }
  .order-ticket .ot-name{ font-family:var(--display); font-weight:700; font-size:14px; margin-top:5px; line-height:1.15; }
  .order-ticket .ot-req{ font-family:var(--tag); font-size:10px; color:var(--thread-red); text-transform:uppercase; margin-top:3px; }
  .order-ticket .ot-patience{ margin-top:7px; height:3px; border-radius:2px; background:var(--canvas); overflow:hidden; }
  .order-ticket .ot-patience i{ display:block; height:100%; background:var(--brass); }
  .order-ticket.working{ background:var(--ink); border-color:var(--ink); }
  .order-ticket.working::before{ background:var(--brass); }
  .order-ticket.working .ot-name{ color:#fff; }
  .order-ticket.working .ot-req{ color:var(--brass); }
  .order-ticket .ot-tag{ font-family:var(--tag); font-size:8.5px; text-transform:uppercase; color:var(--brass); margin-top:5px; letter-spacing:0.06em; }
  .order-ticket.working .ot-name{ margin-top:1px; }
  .tray-empty{ font-family:var(--tag); font-size:11px; color:#a89d80; text-align:center; padding:16px 0 18px; }

  /* ---------------- Modals ---------------- */
  #modal-root{ position:absolute; inset:0; z-index:60; pointer-events:none; }
  .modal-veil{
    position:absolute; inset:0; background:rgba(43,38,32,0.62); pointer-events:auto;
    display:flex; flex-direction:column; justify-content:flex-end;
  }
  .modal{
    background:var(--canvas); border-top:1px solid var(--ink); border-radius:16px 16px 0 0;
    max-height:92%; display:flex; flex-direction:column; box-shadow:0 -6px 24px rgba(0,0,0,0.28);
  }
  .modal.full{ max-height:100%; height:100%; border-radius:0; }
  .modal-head{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 15px; background:var(--paper); border-bottom:1px solid var(--ink); border-radius:16px 16px 0 0;
  }
  .modal.full .modal-head{ border-radius:0; padding-top:calc(var(--safe-top) + 13px); }
  .modal-head h3{ font-family:var(--display); font-size:18px; margin:0; }
  .modal-head .sub{ font-family:var(--tag); font-size:9.5px; color:#8a8069; text-transform:uppercase; margin-top:2px; }
  .x-btn{
    flex:0 0 auto; width:36px; height:36px; border:1px solid var(--ink); border-radius:9px;
    background:var(--canvas); cursor:pointer; font-size:19px; line-height:1; padding:0;
  }
  .modal-body{ flex:1 1 auto; overflow-y:auto; padding:14px 15px calc(var(--safe-bot) + 18px); -webkit-overflow-scrolling:touch; }

  .btn{
    font-family:var(--tag); font-size:12px; text-transform:uppercase; letter-spacing:0.03em;
    border:1px solid var(--ink); border-radius:8px; padding:12px 16px; cursor:pointer;
    background:var(--paper); width:100%; margin-top:9px; display:block;
  }
  .btn:active{ transform:translateY(1px); }
  .btn:disabled{ opacity:0.4; cursor:default; }
  .btn.primary{ background:var(--ink); color:#fff; }
  .btn.good{ background:var(--thread-green); color:#fff; }
  .btn.bad{ background:var(--thread-red); color:#fff; }
  .btn.inline{ width:auto; display:inline-block; margin:0; padding:8px 12px; font-size:10.5px; }
  .btn-row{ display:flex; gap:8px; margin-top:10px; }
  .btn-row .btn{ margin-top:0; }

  /* fabric shop */
  .shop-row{
    display:grid; grid-template-columns:40px 1fr auto; gap:9px; align-items:center;
    border:1px solid var(--line); border-radius:9px; padding:7px 9px; background:#fff; margin-bottom:7px;
  }
  .sw{ width:40px; height:40px; border-radius:6px; border:1px solid var(--ink); }
  .shop-row .nm{ font-size:13px; line-height:1.25; }
  .shop-row .nm small{ display:block; font-family:var(--tag); font-size:10px; color:#8a8069; margin-top:1px; }
  .buy{
    font-family:var(--tag); font-size:10.5px; background:var(--thread-green); color:#fff; border:none;
    border-radius:6px; padding:9px 10px; cursor:pointer; white-space:nowrap;
  }
  .buy:disabled{ background:#bdb49c; cursor:default; }

  /* colour-first fabric picker */
  .shop-group{ margin-bottom:8px; }
  .shop-color{
    width:100%; display:grid; grid-template-columns:34px 1fr 24px; gap:10px; align-items:center;
    border:1px solid var(--ink); border-radius:9px; padding:9px 11px; background:var(--paper);
    cursor:pointer; text-align:left;
  }
  .shop-color.open{ border-radius:9px 9px 0 0; background:#fff; }
  .shop-color .sw{ width:34px; height:34px; border-radius:6px; }
  .shop-color .nm{ font-family:var(--display); font-weight:700; font-size:15px; line-height:1.15; }
  .shop-color .nm small{ display:block; font-family:var(--tag); font-weight:400; font-size:10px; color:#8a8069; margin-top:1px; }
  .shop-color .chev{
    font-family:var(--display); font-weight:800; font-size:20px; line-height:1;
    width:24px; height:24px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius:6px; color:var(--thread-green);
  }
  .shop-drop{
    border:1px solid var(--ink); border-top:none; border-radius:0 0 9px 9px;
    background:var(--canvas); padding:8px 8px 2px;
  }
  .shop-drop .shop-row{ margin-bottom:6px; }

  /* clearance */
  .rack-item{ border:1px solid var(--line); border-radius:9px; background:#fff; padding:10px 11px; margin-bottom:8px; }
  .rack-item .ri-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .rack-item .ri-name{ font-family:var(--display); font-weight:700; font-size:15px; }
  .rack-item .ri-q{ font-family:var(--tag); font-size:10px; color:#8a8069; }
  .rack-item .ri-fab{ display:flex; gap:5px; flex-wrap:wrap; margin-top:7px; }
  .ri-chip{ display:flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:14px; padding:2px 8px 2px 3px; font-size:10.5px; background:var(--paper); }
  .ri-chip .dot{ width:13px; height:13px; border-radius:50%; border:1px solid var(--ink); }

  /* ticket detail */
  .detail-card{ background:#fff; border:1px solid var(--ink); border-radius:10px; padding:15px; position:relative; overflow:hidden; }
  .detail-card::before{ content:""; position:absolute; left:0; right:0; top:0; height:5px; background:repeating-linear-gradient(90deg, var(--thread-red) 0 10px, #fff 10px 16px); }
  .detail-card .dc-name{ font-family:var(--display); font-weight:800; font-size:23px; margin-top:6px; }
  .detail-card .dc-req{ font-family:var(--tag); font-size:11px; color:var(--thread-red); text-transform:uppercase; margin-top:2px; }
  .dc-grid{ margin-top:14px; display:flex; flex-direction:column; gap:12px; }
  .dc-block .lbl{ font-family:var(--tag); font-size:9.5px; text-transform:uppercase; color:#8a8069; margin-bottom:6px; }
  .pref-chip{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--ink); border-radius:20px; padding:4px 11px 4px 4px; font-size:12.5px; margin:0 6px 6px 0; background:var(--paper); }
  .pref-chip .dot{ width:15px; height:15px; border-radius:50%; border:1px solid var(--ink); }
  .budget-big{ font-family:var(--display); font-weight:800; font-size:24px; color:var(--thread-green); }

  .pref-chip.sm{ padding:2px 9px 2px 3px; font-size:11px; margin:0 4px 4px 0; }
  .pref-chip.sm .dot{ width:13px; height:13px; }

  /* requirements reminder shown while choosing fabric */
  .req-strip{
    background:#fff; border:1px solid var(--ink); border-radius:10px;
    padding:10px 12px; margin-bottom:12px;
  }
  .req-strip .rs-name{
    font-family:var(--tag); font-size:9.5px; text-transform:uppercase; color:#8a8069;
    letter-spacing:0.05em; margin-bottom:7px;
  }
  .rs-line{ display:flex; align-items:flex-start; gap:9px; margin-bottom:4px; }
  .rs-line:last-child{ margin-bottom:0; align-items:center; }
  .rs-k{
    flex:0 0 54px; font-family:var(--tag); font-size:9.5px; text-transform:uppercase;
    color:#8a8069; padding-top:4px;
  }
  .rs-line:last-child .rs-k{ padding-top:0; }
  .rs-v{ flex:1; min-width:0; }
  .rs-budget{ font-family:var(--display); font-weight:800; font-size:16px; color:var(--thread-green); }

  /* cutting piece list */
  .piece-btn{
    width:100%; text-align:left; background:#fff; border:1px solid var(--ink); border-radius:9px;
    padding:12px 14px; cursor:pointer; margin-bottom:9px;
  }
  .piece-btn .pb-title{ font-family:var(--tag); font-size:12px; text-transform:uppercase; }
  .piece-btn .pb-yards{ font-size:10.5px; color:#8a8069; margin:2px 0 8px; }
  .pb-status{ font-family:var(--tag); font-size:10.5px; padding:5px 9px; border-radius:6px; display:inline-flex; align-items:center; }
  .pb-status.pending{ background:var(--canvas); color:#8a8069; }
  .pb-status.progress{ background:#f3e6c8; color:#8a6a1f; }
  .pb-status.done{ background:var(--good); color:#fff; }
  .pb-sw{ display:inline-block; width:13px; height:13px; border-radius:50%; border:1px solid var(--ink); margin-right:6px; }
  .quality-row{ display:flex; align-items:center; gap:10px; margin-top:12px; }
  .quality-row .lbl{ font-family:var(--tag); font-size:10px; text-transform:uppercase; white-space:nowrap; }
  .quality-row .wrap{ flex:1; height:11px; border-radius:7px; background:#fff; border:1px solid var(--ink); overflow:hidden; }
  .quality-row .wrap i{ display:block; height:100%; }
  .quality-row .pct{ font-family:var(--display); font-weight:700; font-size:15px; min-width:42px; text-align:right; }

  /* trace view: fills the modal, never scrolls */
  .modal.trace .modal-body{ padding:0; overflow:hidden; display:flex; }
  .trace-wrap{
    flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:10px 12px calc(var(--safe-bot) + 10px);
    background-size:cover; background-position:center 14%; background-repeat:no-repeat;
  }
  .trace-req{
    flex:0 0 auto; max-width:100%; display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:4px 7px; background:rgba(251,247,238,0.93); border:1px solid var(--ink); border-radius:8px; padding:5px 10px;
  }
  .trace-req .tr-k{ font-family:var(--tag); font-size:9px; text-transform:uppercase; color:#8a8069; letter-spacing:0.04em; }
  .trace-req .tr-b{ font-family:var(--display); font-weight:800; font-size:13px; color:var(--thread-green); }
  .chip-label{
    font-family:var(--tag); font-size:9.5px; text-transform:uppercase; color:#6b6252;
    background:rgba(251,247,238,0.9); border-radius:6px; padding:4px 10px;
  }
  .fabric-zone{ flex:0 0 auto; width:100%; display:flex; flex-direction:column; align-items:center; gap:7px; }
  .fabric-grid{
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center;
    background:rgba(251,247,238,0.82); border-radius:10px; padding:8px;
    max-height:34vh; overflow-y:auto;
  }
  .fab-sw{ width:38px; height:38px; border-radius:8px; border:2px solid var(--ink); cursor:pointer; padding:0; }
  .fab-sw.sel{ outline:3px solid var(--thread-red); outline-offset:2px; }
  .fab-sw:disabled{ opacity:0.25; cursor:default; }
  /* collapsed picker: one tappable chip showing the chosen fabric */
  .fab-toggle{
    display:flex; align-items:center; gap:8px; cursor:pointer;
    background:rgba(251,247,238,0.93); border:1px solid var(--ink); border-radius:20px;
    padding:5px 12px 5px 5px; font-family:var(--tag); font-size:10.5px; text-transform:uppercase;
  }
  .fab-toggle .sw{ width:26px; height:26px; border-radius:50%; border:1px solid var(--ink); flex:0 0 26px; }
  .fab-toggle .caret{ font-size:9px; color:#8a8069; }
  /* the piece sits directly on the table &mdash; no backdrop behind it */
  .trace-stage{ flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; }
  canvas.cutc{ touch-action:none; cursor:crosshair; background:transparent; border:none; display:block; }
  .trace-foot{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .prog{ width:240px; max-width:82%; height:7px; border-radius:5px; background:rgba(251,247,238,0.9); border:1px solid var(--line); overflow:hidden; }
  .prog i{ display:block; height:100%; background:var(--thread-red); }
  .done-card{ background:#e9f1ec; border:1px solid var(--ink); border-radius:10px; padding:20px 24px; text-align:center; }
  .done-card .h{ font-family:var(--display); font-weight:800; font-size:20px; }
  .done-card .p{ font-family:var(--tag); font-size:12px; margin-top:6px; }

  /* assembly */
  .asm-stage{
    position:relative; width:290px; height:450px; margin:10px auto 0; touch-action:none;
    background:repeating-linear-gradient(0deg, rgba(43,38,32,0.05) 0 1px, transparent 1px 26px),
               repeating-linear-gradient(90deg, rgba(43,38,32,0.05) 0 1px, transparent 1px 26px), #fffdf8;
    border:1px solid var(--ink); border-radius:10px; overflow:hidden;
  }
  .slot{ position:absolute; border:2px dashed var(--line); display:flex; align-items:flex-end; justify-content:center; padding-bottom:4px; font-family:var(--tag); font-size:9px; color:#a89d80; }
  .apiece{ position:absolute; cursor:grab; }
  .apiece.locked{ cursor:default; }
  .apiece .piece-svg, .art-p .piece-svg{ display:block; pointer-events:none; }
  .apiece .tg{ position:absolute; left:0; right:0; bottom:-2px; text-align:center; font-family:var(--tag); font-size:8px; color:#4a4438; pointer-events:none; }

  /* garment art */
  .art-box{ width:174px; height:224px; margin:6px auto 10px; position:relative; overflow:hidden; }
  .art-in{ position:absolute; left:0; top:0; width:290px; height:450px; transform:scale(0.6); transform-origin:top left; }
  .art-p{ position:absolute; }

  /* pricing */
  .price-line{ font-size:12.5px; line-height:1.7; }
  .price-row{ display:flex; align-items:center; gap:12px; margin-top:12px; }
  .price-row input[type=range]{ flex:1; min-width:0; }
  .price-val{ font-family:var(--display); font-weight:800; font-size:24px; color:var(--thread-green); min-width:78px; text-align:right; }
  .hint{ font-family:var(--tag); font-size:10.5px; color:#8a8069; margin-top:8px; line-height:1.5; }

  /* result / summary */
  .res{ text-align:center; padding:20px 14px; border-radius:10px; border:1px solid var(--ink); }
  .res.ok{ background:#e9f1ec; } .res.no{ background:#f5e8e6; }
  .res .h{ font-family:var(--display); font-weight:800; font-size:21px; }
  .res .d{ font-size:12.5px; margin-top:6px; color:#4a4438; line-height:1.5; }
  .sum-row{ display:flex; justify-content:space-between; padding:9px 2px; border-bottom:1px dashed var(--line-soft); font-size:13.5px; }
  .sum-row:last-child{ border-bottom:none; }
  .sum-row b{ font-family:var(--display); font-size:15px; }

  .menu-item{
    width:100%; text-align:left; background:#fff; border:1px solid var(--ink); border-radius:9px;
    padding:14px 15px; cursor:pointer; margin-bottom:9px; font-size:14px;
  }
  .menu-item small{ display:block; font-family:var(--tag); font-size:10px; color:#8a8069; margin-top:3px; }
  .note{ font-size:12.5px; color:#4a4438; line-height:1.6; }
  .empty{ font-size:12.5px; color:#8a8069; font-style:italic; text-align:center; padding:22px 0; }

  /* ---------- gameplay settings ---------- */
  .opt-row{ display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 13px; margin-bottom:10px; }
  .opt-row.col{ flex-direction:column; align-items:stretch; }
  .opt-txt b{ font-size:14px; display:block; }
  .opt-txt small{ display:block; font-size:11.5px; color:#8a8069; margin-top:3px; line-height:1.45; }
  .switch{ flex:0 0 52px; width:52px; height:30px; border-radius:16px; border:1px solid var(--ink);
    background:var(--canvas); cursor:pointer; padding:0; position:relative; transition:background 0.16s ease; }
  .switch i{ position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
    background:#fff; border:1px solid var(--ink); transition:left 0.16s ease; }
  .switch.on{ background:var(--thread-green); }
  .switch.on i{ left:26px; }

  /* ---------- catalog ---------- */
  .modal.catalog{ background:#e7dcc4; }
  .cat-tabs{ display:flex; gap:8px; margin-bottom:12px; }
  .cat-tab{ flex:1; font-family:var(--tag); font-size:12px; text-transform:uppercase; letter-spacing:0.03em;
    border:1px solid var(--ink); border-radius:8px; padding:10px 6px; background:var(--paper); cursor:pointer; }
  .cat-tab.on{ background:var(--ink); color:#fff; }
  .cat-body{ padding-bottom:6px; }
  .cat-std-row{ display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:8px; }
  .cat-std-row .csr-txt b{ font-family:var(--display); font-weight:700; font-size:15px; }
  .cat-std-row .csr-txt small{ display:block; font-family:var(--tag); font-size:10px; color:#8a8069; margin-top:2px; }
  .ex-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .ex-card{ position:relative; background:var(--paper); border:1px solid var(--ink); border-radius:10px;
    padding:8px 8px 10px; box-shadow:var(--shadow); text-align:center; }
  .ex-card::before{ content:""; position:absolute; left:50%; top:-7px; transform:translateX(-50%);
    width:12px; height:12px; border-radius:50%; background:var(--thread-red); border:1px solid var(--ink); }
  .ex-art{ width:100%; height:150px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .ex-art .art-box{ margin:0 auto; transform:none; }
  .ex-name-row{ display:flex; align-items:flex-start; justify-content:center; gap:6px; margin-top:4px; }
  .ex-name{ font-family:var(--display); font-weight:700; font-size:13px; line-height:1.15; }
  .ex-name-row .ex-name{ margin-top:0; }
  .ex-edit{
    flex:0 0 auto; width:22px; height:22px; border:1px solid var(--ink); border-radius:5px;
    background:var(--canvas); cursor:pointer; padding:0; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .ex-edit:active{ background:var(--paper); }
  .ex-val{ font-family:var(--tag); font-size:11px; color:var(--thread-green); margin-top:2px; }
  .ex-x{ position:absolute; top:5px; right:6px; width:22px; height:22px; border-radius:50%;
    border:1px solid var(--ink); background:#fff; cursor:pointer; font-size:15px; line-height:1; padding:0; z-index:2; }

  /* ---------- donations ---------- */
  .don-count{ font-family:var(--tag); font-size:12px; color:var(--ink); text-align:center; margin:2px 0 10px; }
  .rack-item.don{ cursor:pointer; }
  .rack-item.don.sel{ border-color:var(--thread-green); box-shadow:0 0 0 2px rgba(62,98,89,0.28) inset; background:#f3f8f4; }
  .don-check{ font-family:var(--display); font-weight:800; color:var(--thread-green); font-size:16px; min-width:16px; }

  .slider-row{ display:flex; align-items:center; gap:9px; margin-top:11px; }
  .slider-row input[type=range]{ flex:1; min-width:0; }
  .slider-cap{ font-family:var(--tag); font-size:9px; color:#8a8069; white-space:nowrap; }
  .slider-val{ font-family:var(--display); font-weight:700; font-size:15px; text-align:center; margin-top:7px; }

  /* ---------- custom orders ---------- */
  .ci-row{ display:grid; grid-template-columns:52px 1fr 32px; gap:10px; align-items:center;
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 9px; margin-bottom:8px; }
  .ci-thumb{ width:52px; height:48px; display:flex; align-items:center; justify-content:center; }
  .ci-txt b{ font-size:13.5px; }
  .ci-txt small{ display:block; font-family:var(--tag); font-size:10px; color:#8a8069; margin-top:2px; line-height:1.4; }
  .ci-x{ width:30px; height:30px; border:1px solid var(--line); border-radius:7px; background:var(--canvas);
    cursor:pointer; font-size:16px; line-height:1; padding:0; color:var(--bad); }
  .name-input{ width:100%; font-family:var(--body); font-size:14px; padding:8px 10px;
    border:1px solid var(--ink); border-radius:7px; background:#fff; }

  /* ---------- free arrangement + layers ---------- */
  .custom-asm{ display:flex; gap:7px; align-items:flex-start; margin-top:10px; }
  .asm-stage.cstage{ margin:0; flex:1 1 auto; min-width:0; height:380px; position:relative;
    overflow:hidden; touch-action:none; }
  .cstage-inner{ position:absolute; left:0; top:0; width:250px; height:380px; transform-origin:top left; }
  .layer-panel{ flex:0 0 58px; width:58px; min-width:0; background:var(--paper); border:1px solid var(--ink);
    border-radius:9px; padding:6px 4px; }
  .lp-head{ font-family:var(--tag); font-size:9.5px; text-transform:uppercase; color:#8a8069;
    text-align:center; margin-bottom:6px; letter-spacing:0.05em; }
  .lp-top, .lp-bot{ font-family:var(--tag); font-size:8.5px; color:#a89d80; text-align:center; padding:2px 0; }
  .lp-list{ position:relative; }
  .lp-item{ position:absolute; left:0; right:0; height:32px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1px;
    background:#fff; border:1px solid var(--ink); border-radius:6px; padding:0 2px; cursor:grab;
    touch-action:none; transition:transform 0.12s ease; overflow:hidden; }
  .lp-item.dragging{ cursor:grabbing; box-shadow:var(--shadow); z-index:20; transition:none; }
  .lp-sw{ width:16px; height:11px; border-radius:3px; border:1px solid var(--ink); flex:0 0 11px; }
  .lp-name{ font-size:8px; line-height:1.05; max-width:100%; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; text-align:center; }
  .lp-head{ font-size:8px; }
  .apiece{ touch-action:none; }
  .art-box.cart{ width:162px; height:247px; }
  .art-in.cart-in{ width:250px; height:380px; transform:scale(0.65); }

  .toast{
    position:absolute; left:50%; bottom:118px; transform:translateX(-50%) translateY(14px);
    background:var(--ink); color:#fff; font-family:var(--tag); font-size:11.5px;
    padding:9px 16px; border-radius:20px; opacity:0; pointer-events:none; z-index:90;
    transition:opacity 0.22s ease, transform 0.22s ease; max-width:88%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* themed text-entry popup */
  .prompt-veil{
    position:absolute; inset:0; z-index:95; background:rgba(43,38,32,0.62);
    display:flex; align-items:center; justify-content:center; padding:22px;
    padding-top:calc(var(--safe-top) + 22px); padding-bottom:calc(var(--safe-bot) + 22px);
  }
  .prompt-card{
    width:100%; max-width:340px; background:var(--canvas); border:1px solid var(--ink);
    border-radius:14px; box-shadow:0 10px 30px rgba(43,38,32,0.4); overflow:hidden;
    animation:prompt-pop 0.16s ease-out;
  }
  @keyframes prompt-pop{ from{ transform:translateY(10px) scale(0.98); opacity:0; } to{ transform:none; opacity:1; } }
  .prompt-head{ padding:13px 15px; background:var(--paper); border-bottom:1px solid var(--ink); position:relative; }
  .prompt-head::before{ content:""; position:absolute; left:0; right:0; top:0; height:4px;
    background:repeating-linear-gradient(90deg, var(--thread-green) 0 10px, transparent 10px 16px); }
  .prompt-head h3{ font-family:var(--display); font-weight:800; font-size:18px; margin:0; }
  .prompt-head .sub{ font-family:var(--tag); font-size:9.5px; color:#8a8069; text-transform:uppercase; letter-spacing:0.05em; margin-top:2px; }
  .prompt-body{ padding:14px 15px 16px; }
  .prompt-label{ font-size:12px; color:#6f6656; line-height:1.35; margin-bottom:9px; }
  .prompt-input{
    width:100%; font-family:var(--body); font-size:15px; color:var(--ink); background:#fff;
    border:1px solid var(--ink); border-radius:8px; padding:11px 12px;
  }
  .prompt-input:focus{ outline:none; border-color:var(--thread-green); box-shadow:0 0 0 2px rgba(62,98,89,0.18); }
  .prompt-actions{ display:flex; gap:8px; margin-top:12px; }
  .prompt-actions .btn{ margin-top:0; }

  ::-webkit-scrollbar{ width:7px; height:7px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  @media (min-width:520px){
    .hud-title{ font-size:22px; }
    .stat .v{ font-size:16px; }
  }
</style>
</head>

  <div id="hud"></div>
  <div id="scene"></div>
  <div id="tray"></div>
  <div id="modal-root"></div>

</div>

var SAVE_KEY = 'fashionfrenzy_savegame';
var SETTINGS_KEY = 'fashionfrenzy_settings';

/* Player-tunable gameplay options, persisted separately from the save. */
var settings = { patience:false, precisionMatters:false, sellingHelp:true, dayMinutes:10 };

function loadSettings(){
  try{
    var raw=window.localStorage.getItem(SETTINGS_KEY);
    if (!raw) return;
    var d=JSON.parse(raw);
    if (typeof d.patience==='boolean') settings.patience=d.patience;
    if (typeof d.precisionMatters==='boolean') settings.precisionMatters=d.precisionMatters;
    if (typeof d.sellingHelp==='boolean') settings.sellingHelp=d.sellingHelp;
    if (typeof d.dayMinutes==='number') settings.dayMinutes=clamp(d.dayMinutes,1,60);
  }catch(e){}
}
function saveSettings(){
  try{ window.localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); return true; }
  catch(e){ return false; }
}

/* Build every colour x pattern combination, colour-major so the shop menu
   can group the three pattern bolts under each colour. */
var FABRIC_RECIPES = [];
COLORS.forEach(function(c){
  PATTERNS.forEach(function(p){ FABRIC_RECIPES.push([c.id, p.id]); });
});

function colorRarity(id){
  var rare = {purple:1.6, gold:1.4, emerald:1.3, navy:1, crimson:0.9, blush:0.9};
  return rare[id] || 0.7;
}

var FABRICS = FABRIC_RECIPES.map(function(r,i){
  var c = COLORS.filter(function(x){ return x.id===r[0]; })[0];
  var p = PATTERNS.filter(function(x){ return x.id===r[1]; })[0];
  return {
    id:'f'+i, colorId:c.id, colorName:c.name, hex:c.hex,
    patternId:p.id, patternName:p.name,
    pricePerYard: 4 + Math.round(colorRarity(c.id)*2) + p.priceAdd
  };
});

/* ============================= HELPERS ============================= */

function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function rnd(a,b){ return a + Math.random()*(b-a); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function money(n){ return '$' + Number(n).toFixed(2); }
function fabricById(id){ for(var i=0;i<FABRICS.length;i++){ if(FABRICS[i].id===id) return FABRICS[i]; } return null; }
function garmentTypeById(id){ for(var i=0;i<GARMENT_TYPES.length;i++){ if(GARMENT_TYPES[i].id===id) return GARMENT_TYPES[i]; } return null; }
function partOf(g,pid){ for(var i=0;i<g.parts.length;i++){ if(g.parts[i].id===pid) return g.parts[i]; } return null; }
function ownedYards(fid){ return state.stock[fid] || 0; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function shade(hex,pct){
  var n = parseInt(hex.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=clamp(Math.round(r+(pct/100)*255),0,255);
  g=clamp(Math.round(g+(pct/100)*255),0,255);
  b=clamp(Math.round(b+(pct/100)*255),0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function lighten(h,p){ return shade(h,p); }
function darken(h,p){ return shade(h,-p); }

function swatchBg(f){
  var base=f.hex, light=lighten(base,20), dark=darken(base,16);
  switch(f.patternId){
    case 'stripes': return 'repeating-linear-gradient(45deg,'+base+' 0 6px,'+light+' 6px 12px)';
    case 'dots': return 'radial-gradient('+light+' 30%, transparent 32%) 0 0/10px 10px,radial-gradient('+light+' 30%, transparent 32%) 5px 5px/10px 10px,'+base;
    case 'plaid': return 'repeating-linear-gradient(0deg,'+dark+' 0 3px, transparent 3px 10px),repeating-linear-gradient(90deg,'+dark+' 0 3px, transparent 3px 10px),'+base;
    default: return base;
  }
}

function fmtClock(mins){
  var h = Math.floor(mins/60), m = Math.floor(mins%60);
  var ap = h >= 12 ? 'PM' : 'AM';
  var hh = h % 12; if (hh === 0) hh = 12;
  return hh + ':' + (m<10?'0':'') + m + ' ' + ap;
}

function toast(msg){
  var t = document.getElementById('toast');
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(function(){ t.classList.remove('show'); }, 2100);
}

/* A themed text-entry popup that matches the game's paper-and-thread look,
   used in place of the plain browser prompt. Resolves through opts.onConfirm
   (trimmed value) or opts.onCancel. */
function gamePrompt(opts){
  opts = opts || {};
  var host = document.getElementById('prompt-root');
  if (!host){
    host = document.createElement('div');
    host.id = 'prompt-root';
    document.getElementById('game').appendChild(host);
  }
  var title = opts.title || 'Name It';
  var sub   = opts.sub || '';
  var label = opts.label || '';
  var def   = opts.value || '';
  var okTxt = opts.okLabel || 'Save';
  var maxlen= opts.maxLength || 40;

  host.innerHTML =
    '<div class="prompt-veil">'+
      '<div class="prompt-card" role="dialog" aria-modal="true">'+
        '<div class="prompt-head"><h3>'+esc(title)+'</h3>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div>'+
        '<div class="prompt-body">'+
          (label?'<div class="prompt-label">'+esc(label)+'</div>':'')+
          '<input class="prompt-input" id="prompt-input" type="text" maxlength="'+maxlen+'" '+
            'value="'+esc(def)+'" autocomplete="off" autocapitalize="words" spellcheck="false">'+
          '<div class="prompt-actions">'+
            '<button class="btn" id="prompt-cancel">Cancel</button>'+
            '<button class="btn primary" id="prompt-ok">'+esc(okTxt)+'</button>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>';

  var input = document.getElementById('prompt-input');
  function close(){ host.innerHTML = ''; }
  function confirm(){ var v = input.value.trim(); close(); if (opts.onConfirm) opts.onConfirm(v); }
  function cancel(){ close(); if (opts.onCancel) opts.onCancel(); }

  document.getElementById('prompt-ok').addEventListener('click', confirm);
  document.getElementById('prompt-cancel').addEventListener('click', cancel);
  host.querySelector('.prompt-veil').addEventListener('click', function(e){ if (e.target===this) cancel(); });
  input.addEventListener('keydown', function(e){
    if (e.key==='Enter'){ e.preventDefault(); confirm(); }
    else if (e.key==='Escape'){ e.preventDefault(); cancel(); }
  });
  setTimeout(function(){ input.focus(); input.select(); }, 30);
}

var TILE_CACHE = {};
function fabricTile(f){
  if (TILE_CACHE[f.id]) return TILE_CACHE[f.id];
  var s=16, c=document.createElement('canvas'); c.width=s; c.height=s;
  var x=c.getContext('2d'), base=f.hex, light=lighten(base,22), dark=darken(base,20);
  x.fillStyle=base; x.fillRect(0,0,s,s);
  if (f.patternId==='stripes'){
    x.fillStyle=light;
    x.beginPath(); x.moveTo(0,s); x.lineTo(s,0); x.lineTo(s,s*0.4); x.lineTo(s*0.4,s); x.closePath(); x.fill();
    x.beginPath(); x.moveTo(0,0); x.lineTo(s*0.6,0); x.lineTo(0,s*0.6); x.closePath(); x.fill();
  } else if (f.patternId==='dots'){
    x.fillStyle=light;
    x.beginPath(); x.arc(s*0.25,s*0.25,s*0.16,0,Math.PI*2); x.fill();
    x.beginPath(); x.arc(s*0.75,s*0.75,s*0.16,0,Math.PI*2); x.fill();
  } else if (f.patternId==='plaid'){
    x.fillStyle=dark; x.globalAlpha=0.55;
    x.fillRect(0,s*0.4,s,s*0.2); x.fillRect(s*0.4,0,s*0.2,s); x.globalAlpha=1;
  }
  TILE_CACHE[f.id]=c; return c;
}

var CLIP_CACHE = {};
function shapeClip(key){
  if (CLIP_CACHE[key]) return CLIP_CACHE[key];
  var pts=SHAPES[key].points;
  var xs=pts.map(function(p){return p[0];}), ys=pts.map(function(p){return p[1];});
  var minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
  var minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  var w=maxX-minX, h=maxY-minY;
  var poly=pts.map(function(p){
    return ((p[0]-minX)/w*100).toFixed(1)+'% '+((p[1]-minY)/h*100).toFixed(1)+'%';
  }).join(', ');
  CLIP_CACHE[key]='polygon('+poly+')';
  return CLIP_CACHE[key];
}

/* ============================= ORDER GENERATION ============================= */

function generateGuest(){
  var pool = enabledGarments(); if (!pool.length) pool = GARMENT_TYPES;
  var garment = pick(pool);
  var wantColors;
  if (Math.random() < 0.14){ wantColors=['any']; }
  else {
    var n = Math.random()<0.6 ? 1 : 2; wantColors=[];
    while (wantColors.length<n){
      var c=pick(COLORS).id;
      if (wantColors.indexOf(c)===-1) wantColors.push(c);
    }
  }
  var wantPattern = Math.random()<0.2 ? 'any' : pick(PATTERNS).id;
  var est = garment.parts.reduce(function(s,p){ return s+p.yards*6.5; },0);
  var repF = 1 + (state.reputation-50)/220;
  return {
    id:'t'+(ticketSeq++),
    name:pick(GUEST_NAMES),
    garment:garment,
    wantColors:wantColors,
    wantPattern:wantPattern,
    budget:Math.round(est*rnd(1.5,2.6)*repF),
    arrivedAt:state.clock,
    patience:Math.round(rnd(130,210))
  };
}

function activeOrderCount(){
  return state.tickets.length + (state.guest ? 1 : 0);
}

/* A custom order: the guest names colors and a budget, nothing else.
   Everything about the garment is left to the player. */
function generateCustomGuest(){
  var wantColors;
  if (Math.random()<0.2){ wantColors=['any']; }
  else {
    var n=Math.random()<0.65?1:2; wantColors=[];
    while (wantColors.length<n){
      var c=pick(COLORS).id;
      if (wantColors.indexOf(c)===-1) wantColors.push(c);
    }
  }
  var repF=1+(state.reputation-50)/220;
  return {
    id:'t'+(ticketSeq++),
    name:pick(GUEST_NAMES),
    custom:true,
    garment:{ id:'custom', name:'Custom Design', parts:[] },
    wantColors:wantColors,
    wantPattern:'any',
    budget:Math.round(rnd(70,190)*repF),
    arrivedAt:state.clock,
    patience:Math.round(rnd(150,240))
  };
}

function isCustom(){ return !!(state.guest && state.guest.custom); }

function enabledGarments(){
  return GARMENT_TYPES.filter(function(g){ return !state.catalogOff[g.id]; });
}

function spawnTicket(){
  if (activeOrderCount() >= MAX_ORDERS) return;
  /* guests sometimes come in asking for one of your signature exclusives */
  if (state.exclusives.length && Math.random()<0.22){ state.tickets.push(generateExclusiveGuest()); return; }
  /* if every standard offering is switched off, only custom orders come in */
  if (!enabledGarments().length){ state.tickets.push(generateCustomGuest()); return; }
  state.tickets.push(Math.random()<0.28 ? generateCustomGuest() : generateGuest());
}

function exclusiveById(id){
  for (var i=0;i<state.exclusives.length;i++) if (state.exclusives[i].id===id) return state.exclusives[i];
  return null;
}

/* A guest who wants a specific signature piece from the Exclusive catalog. */
function generateExclusiveGuest(){
  var ex=pick(state.exclusives);
  var repF=1+(state.reputation-50)/220;
  var base=ex.value||ex.cost||40;
  return {
    id:'t'+(ticketSeq++),
    name:pick(GUEST_NAMES),
    exclusiveId:ex.id, exclusiveName:ex.name,
    garment:{ id:'exclusive', name:'Exclusive: '+ex.name },
    wantColors:['any'], wantPattern:'any',
    budget:Math.round(base*rnd(1.1,1.6)*repF),
    arrivedAt:state.clock,
    patience:Math.round(rnd(130,210))
  };
}

/* ============================= SCORING ============================= */

function partMatchQuality(fid){
  if (!fid) return null;
  var f=fabricById(fid), g=state.guest;
  var cm = g.wantColors.indexOf('any')!==-1 || g.wantColors.indexOf(f.colorId)!==-1;
  var pm = g.wantPattern==='any' || g.wantPattern===f.patternId;
  return (cm?60:15)+(pm?40:10);
}

function reservedYards(fid, exceptPart){
  var sum=0, g=state.guest;
  if (!g) return 0;
  for (var pid in state.cutting){
    if (pid===exceptPart) continue;
    var st=state.cutting[pid];
    if (st && st.fabricId===fid && !st.done){
      var p=partOf(g.garment,pid); if (p) sum+=p.yards;
    }
  }
  return sum;
}

function currentOverallQuality(){
  var g=state.guest, w=0, tot=0, complete=true;
  g.garment.parts.forEach(function(p){
    var st=state.cutting[p.id], q;
    if (st && st.done) q=st.finalQuality;
    else if (st && st.fabricId) q=st.matchQuality*0.9;
    else { q=0; complete=false; }
    tot+=q*p.weight; w+=p.weight;
  });
  return { pct: w?tot/w:0, complete:complete };
}

/* ============================= CUTTING =============================
   The player cuts a real pattern piece out of a square of cloth:
   guide lines are printed on the cloth, they drag the blade around them,
   and whatever outline they actually cut becomes the piece used later. */

var CLOTH = 200;          /* the cloth square is CLOTH x CLOTH units */
var CUT_TOL = 16;         /* how near the guide a cut counts as following it */
var CLOSE_COVERAGE = 88;  /* percent of the guide that must be cut through */

/* Fit a pattern shape into the middle of the cloth square. */
var TARGET_CACHE = {};
function targetPolyFor(shapeKey){
  if (TARGET_CACHE[shapeKey]) return TARGET_CACHE[shapeKey];
  var pts=SHAPES[shapeKey].points;
  var xs=pts.map(function(p){return p[0];}), ys=pts.map(function(p){return p[1];});
  var minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
  var minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  var w=maxX-minX, h=maxY-minY;
  var s=Math.min((CLOTH-46)/w,(CLOTH-46)/h);
  var ox=(CLOTH-w*s)/2-minX*s, oy=(CLOTH-h*s)/2-minY*s;
  TARGET_CACHE[shapeKey]=pts.map(function(p){ return [p[0]*s+ox, p[1]*s+oy]; });
  return TARGET_CACHE[shapeKey];
}

/* Even sample points around the guide, used for scoring the cut. */
function polygonResample(points, spacing){
  var pts=points.concat([points[0]]), segLens=[], total=0;
  for (var i=0;i<pts.length-1;i++){
    var dx=pts[i+1][0]-pts[i][0], dy=pts[i+1][1]-pts[i][1];
    var l=Math.sqrt(dx*dx+dy*dy); segLens.push(l); total+=l;
  }
  var n=Math.max(40, Math.round(total/spacing)), out=[], seg=0, acc=0;
  for (var k=0;k<n;k++){
    var target=(k/n)*total;
    while (seg<segLens.length-1 && acc+segLens[seg]<target){ acc+=segLens[seg]; seg++; }
    var a=pts[seg], b=pts[seg+1], sl=segLens[seg]||1;
    var t=clamp((target-acc)/sl,0,1);
    out.push({ x:a[0]+(b[0]-a[0])*t, y:a[1]+(b[1]-a[1])*t, cut:false, minDist:Infinity });
  }
  return out;
}

/* Update guide coverage/accuracy for one point of the blade's travel. */
function markNear(st,p){
  for (var i=0;i<st.resample.length;i++){
    var s=st.resample[i], dx=s.x-p.x, dy=s.y-p.y;
    var d=Math.sqrt(dx*dx+dy*dy);
    if (d<s.minDist) s.minDist=d;
    if (!s.cut && d<=CUT_TOL) s.cut=true;
  }
}
function markAlong(st,p0,p1){
  var dx=p1.x-p0.x, dy=p1.y-p0.y;
  var steps=Math.max(2, Math.min(24, Math.ceil(Math.sqrt(dx*dx+dy*dy)/3)));
  for (var s=0;s<=steps;s++){
    var t=s/steps;
    markNear(st,{ x:p0.x+dx*t, y:p0.y+dy*t });
  }
}
function piecePercentCut(st){
  var n=0;
  for (var i=0;i<st.resample.length;i++) if (st.resample[i].cut) n++;
  return n/st.resample.length*100;
}

/* Record where the blade actually went. */
function addCutPoint(st,p){
  var last=st.cutPath.length?st.cutPath[st.cutPath.length-1]:null;
  if (last){
    var dx=p.x-last.x, dy=p.y-last.y;
    if (dx*dx+dy*dy < 4) return;   /* skip jitter */
  }
  st.cutPath.push({x:clamp(p.x,0,CLOTH), y:clamp(p.y,0,CLOTH)});
}

/* Reduce the traced path to a tidy polygon for rendering later. */
function simplifyPath(path, maxPts){
  if (path.length<=maxPts) return path.slice();
  var step=path.length/maxPts, out=[];
  for (var i=0;i<maxPts;i++) out.push(path[Math.floor(i*step)]);
  return out;
}

/* Turn the cut outline into a CSS clip-path plus its aspect ratio. */
function pathToClip(path){
  if (!path || path.length<3) return null;
  var xs=path.map(function(p){return p.x;}), ys=path.map(function(p){return p.y;});
  var minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
  var minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  var w=Math.max(1,maxX-minX), h=Math.max(1,maxY-minY);
  var poly=path.map(function(p){
    return ((p.x-minX)/w*100).toFixed(1)+'% '+((p.y-minY)/h*100).toFixed(1)+'%';
  }).join(', ');
  return { clip:'polygon('+poly+')', aspect:w/h };
}

function selectFabricForPart(partId, fid){
  var g=state.guest, part=partOf(g.garment,partId);
  if (!fid){ state.cutting[partId]=null; renderModal(); return; }
  var avail = ownedYards(fid) - reservedYards(fid, partId);
  if (avail + 1e-9 < part.yards){ toast('Not enough unreserved yardage.'); return; }
  var target=targetPolyFor(part.shape);
  state.cutting[partId] = {
    fabricId:fid,
    target:target,
    resample:polygonResample(target, 5),
    cutPath:[],
    dragging:false, prevPoint:null,
    done:false, matchQuality:partMatchQuality(fid), finalQuality:null, precision:null,
    cutClip:null, cutAspect:null
  };
  state.ui.fabricOpen=false;
  renderModal();
}

function resetPieceTrace(partId){
  var st=state.cutting[partId];
  if (!st || st.done) return;
  st.resample=polygonResample(st.target, 5);
  st.cutPath=[]; st.prevPoint=null; st.dragging=false;
  renderModal();
}

/* Finish the piece once the blade has travelled the whole guide. */
function finishPieceIfDone(partId, st){
  if (st.done || piecePercentCut(st) < CLOSE_COVERAGE) return false;
  var shaped=simplifyPath(st.cutPath, 56);
  var clip=pathToClip(shaped);
  if (!clip) return false;

  st.done=true;
  st.cutShape=shaped;
  st.cutClip=clip.clip;
  st.cutAspect=clip.aspect;

  var sum=0,count=0;
  st.resample.forEach(function(s){ if (s.cut && isFinite(s.minDist)){ sum+=s.minDist; count++; } });
  var avgDev = count ? sum/count : 12;
  st.precision = clamp(100 - avgDev*7, 30, 100);
  st.finalQuality = st.matchQuality * (0.85 + 0.15*(st.precision/100));

  var part = partOf(state.guest.garment, partId);
  state.stock[st.fabricId] -= part.yards;
  toast(part.label + ' cut &middot; ' + Math.round(st.precision) + '% precision');
  return true;
}

function initCuttingCanvas(canvas, partId){
  if (!state.guest || !partId) return;
  var part=partOf(state.guest.garment,partId);
  if (!part) return;

  /* the cloth is square, so fit the largest square in the space left over */
  var host=canvas.parentElement;
  var availW=(host && host.clientWidth ? host.clientWidth : window.innerWidth)-8;
  var availH=(host && host.clientHeight ? host.clientHeight : window.innerHeight*0.4)-8;
  var side=Math.max(120, Math.min(availW, availH));
  var dpr=window.devicePixelRatio||1;
  canvas.width=side*dpr; canvas.height=side*dpr;
  canvas.style.width=side+'px'; canvas.style.height=side+'px';
  var ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var scale=side/CLOTH;

  function toLocal(e){
    var r=canvas.getBoundingClientRect();
    return { x:((e.clientX-r.left)*(side/r.width))/scale, y:((e.clientY-r.top)*(side/r.height))/scale };
  }

  function tracePoly(pts, closeIt){
    ctx.beginPath();
    ctx.moveTo(pts[0].x!==undefined?pts[0].x:pts[0][0], pts[0].y!==undefined?pts[0].y:pts[0][1]);
    for (var i=1;i<pts.length;i++){
      var p=pts[i];
      ctx.lineTo(p.x!==undefined?p.x:p[0], p.y!==undefined?p.y:p[1]);
    }
    if (closeIt) ctx.closePath();
  }

  function draw(){
    var st=state.cutting[partId]; if(!st) return;
    var fabric=fabricById(st.fabricId);
    ctx.clearRect(0,0,side,side);
    ctx.save(); ctx.scale(scale,scale);

    if (st.done && st.cutShape){
      /* the cloth is gone &mdash; only the piece they cut remains */
      ctx.save();
      tracePoly(st.cutShape,true); ctx.clip();
      ctx.fillStyle=ctx.createPattern(fabricTile(fabric),'repeat');
      ctx.fillRect(0,0,CLOTH,CLOTH);
      ctx.restore();
      ctx.lineWidth=2; ctx.strokeStyle='#2B2620';
      tracePoly(st.cutShape,true); ctx.stroke();
      ctx.restore();
      return;
    }

    /* the square of cloth */
    ctx.fillStyle=ctx.createPattern(fabricTile(fabric),'repeat');
    ctx.fillRect(0,0,CLOTH,CLOTH);
    ctx.lineWidth=1.5; ctx.strokeStyle='rgba(43,38,32,0.55)';
    ctx.strokeRect(0.75,0.75,CLOTH-1.5,CLOTH-1.5);

    /* printed guide lines, brightening as the blade passes them */
    var sm=st.resample;
    for (var j=0;j<sm.length;j++){
      var a=sm[j], b=sm[(j+1)%sm.length];
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
      if (a.cut && b.cut){ ctx.strokeStyle='rgba(251,247,238,0.95)'; ctx.lineWidth=2.5; ctx.setLineDash([]); }
      else { ctx.strokeStyle='rgba(251,247,238,0.7)'; ctx.lineWidth=1.5; ctx.setLineDash([5,4]); }
      ctx.stroke();
    }
    ctx.setLineDash([]);

    /* the cut the player has actually made */
    if (st.cutPath.length>1){
      ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.strokeStyle='rgba(43,38,32,0.35)'; ctx.lineWidth=5;
      tracePoly(st.cutPath,false); ctx.stroke();
      ctx.strokeStyle='#B23A48'; ctx.lineWidth=2.5;
      tracePoly(st.cutPath,false); ctx.stroke();
    }
    if (st.cutPath.length){
      var last=st.cutPath[st.cutPath.length-1];
      ctx.beginPath(); ctx.arc(last.x,last.y,4.5,0,Math.PI*2);
      ctx.fillStyle='#B23A48'; ctx.fill();
      var first=st.cutPath[0];
      ctx.beginPath(); ctx.arc(first.x,first.y,4,0,Math.PI*2);
      ctx.strokeStyle='#2B2620'; ctx.lineWidth=1.5; ctx.stroke();
    }
    ctx.restore();
  }
  draw();
  canvas._redraw=draw;

  canvas.addEventListener('pointerdown', function(e){
    var st=state.cutting[partId]; if(!st||st.done) return;
    e.preventDefault();
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    st.dragging=true;
    var p=toLocal(e);
    markNear(st,p); addCutPoint(st,p);
    st.prevPoint=p;
    draw(); updateTraceUI(partId);
  });
  canvas.addEventListener('pointermove', function(e){
    var st=state.cutting[partId]; if(!st||!st.dragging||st.done) return;
    e.preventDefault();
    var p=toLocal(e);
    if (st.prevPoint) markAlong(st,st.prevPoint,p); else markNear(st,p);
    addCutPoint(st,p);
    st.prevPoint=p;
    draw(); updateTraceUI(partId);
  });
  function end(){
    var st=state.cutting[partId]; if(!st) return;
    st.dragging=false; st.prevPoint=null;
    var justDone=finishPieceIfDone(partId,st);
    draw();
    if (justDone) renderModal(); else updateTraceUI(partId);
  }
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
}

/* Free-form cutting canvas for custom items: plain cloth, no guide lines. */
function initFreeCanvas(canvas){
  var d=state.customDraft;
  if (!d || !d.fabricId) return;
  var host=canvas.parentElement;
  var availW=(host && host.clientWidth ? host.clientWidth : window.innerWidth)-8;
  var availH=(host && host.clientHeight ? host.clientHeight : window.innerHeight*0.4)-8;
  var side=Math.max(120, Math.min(availW, availH));
  var dpr=window.devicePixelRatio||1;
  canvas.width=side*dpr; canvas.height=side*dpr;
  canvas.style.width=side+'px'; canvas.style.height=side+'px';
  var ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var scale=side/CLOTH;

  function toLocal(e){
    var r=canvas.getBoundingClientRect();
    return { x:((e.clientX-r.left)*(side/r.width))/scale, y:((e.clientY-r.top)*(side/r.height))/scale };
  }
  function trace(pts, close){
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for (var i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
    if (close) ctx.closePath();
  }
  function draw(){
    var dd=state.customDraft; if(!dd||!dd.fabricId) return;
    var f=fabricById(dd.fabricId);
    ctx.clearRect(0,0,side,side);
    ctx.save(); ctx.scale(scale,scale);
    ctx.fillStyle=ctx.createPattern(fabricTile(f),'repeat');
    ctx.fillRect(0,0,CLOTH,CLOTH);
    ctx.lineWidth=1.5; ctx.strokeStyle='rgba(43,38,32,0.55)';
    ctx.strokeRect(0.75,0.75,CLOTH-1.5,CLOTH-1.5);

    if (dd.cutPath.length>1){
      ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.strokeStyle='rgba(43,38,32,0.35)'; ctx.lineWidth=5;
      trace(dd.cutPath,false); ctx.stroke();
      ctx.strokeStyle='#B23A48'; ctx.lineWidth=2.5;
      trace(dd.cutPath,false); ctx.stroke();
    }
    if (dd.cutPath.length){
      var first=dd.cutPath[0], last=dd.cutPath[dd.cutPath.length-1];
      /* highlight the start so the player can see where to close the loop */
      ctx.beginPath(); ctx.arc(first.x,first.y,7,0,Math.PI*2);
      ctx.strokeStyle=customCutClosed(dd)?'#3E6259':'#2B2620';
      ctx.lineWidth=2; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(last.x,last.y,4.5,0,Math.PI*2);
      ctx.fillStyle='#B23A48'; ctx.fill();
    }
    ctx.restore();
  }
  draw();

  function refreshFoot(){
    var dd=state.customDraft; if(!dd) return;
    var btn=document.getElementById('finish-cut');
    if (btn) btn.disabled=!customCutUsable(dd);
    var lbl=document.getElementById('free-hint');
    if (lbl) lbl.textContent = !dd.cutPath.length ? 'drag to cut any shape you like'
      : (customCutClosed(dd) ? 'shape closed &mdash; ready to keep' : 'return to the circle to close the shape');
  }

  canvas.addEventListener('pointerdown', function(e){
    var dd=state.customDraft; if(!dd) return;
    e.preventDefault();
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    dd.dragging=true;
    var p=toLocal(e);
    dd.cutPath.push({x:clamp(p.x,0,CLOTH), y:clamp(p.y,0,CLOTH)});
    dd.prevPoint=p; draw(); refreshFoot();
  });
  canvas.addEventListener('pointermove', function(e){
    var dd=state.customDraft; if(!dd||!dd.dragging) return;
    e.preventDefault();
    var p=toLocal(e), last=dd.cutPath[dd.cutPath.length-1];
    if (!last || (p.x-last.x)*(p.x-last.x)+(p.y-last.y)*(p.y-last.y)>=4){
      dd.cutPath.push({x:clamp(p.x,0,CLOTH), y:clamp(p.y,0,CLOTH)});
    }
    dd.prevPoint=p; draw(); refreshFoot();
  });
  function end(){
    var dd=state.customDraft; if(!dd) return;
    dd.dragging=false; dd.prevPoint=null;
    draw();
    if (customCutClosed(dd)){ finishCustomItem(); return; }
    refreshFoot();
  }
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
}

function updateTraceUI(partId){
  var st=state.cutting[partId]; if(!st) return;
  var pct=Math.round(piecePercentCut(st));
  var bar=document.querySelector('.prog i');
  var lbl=document.getElementById('trace-pct');
  if (bar) bar.style.width=pct+'%';
  if (lbl) lbl.textContent=pct+'% cut';
}

/* ============================= CUSTOM ORDERS =============================
   No pattern to follow: the player names a piece, picks cloth, and cuts
   whatever shape they like. The cut becomes the piece. */

var CSTAGE_W=250, CSTAGE_H=380;   /* free-arrangement space, in stage units */
var CUSTOM_SCALE=0.62;            /* cloth units -> stage pixels */
var CLOTH_YARDS=2;                /* one square of cloth costs this much yardage */

function polygonArea(pts){
  var a=0;
  for (var i=0;i<pts.length;i++){
    var p=pts[i], q=pts[(i+1)%pts.length];
    a += p.x*q.y - q.x*p.y;
  }
  return Math.abs(a)/2;
}
function pathLength(pts){
  var L=0;
  for (var i=1;i<pts.length;i++){
    var dx=pts[i].x-pts[i-1].x, dy=pts[i].y-pts[i-1].y;
    L+=Math.sqrt(dx*dx+dy*dy);
  }
  return L;
}

function startCustomItem(){
  state.customDraft={ name:'', fabricId:null, cutPath:[], dragging:false, prevPoint:null };
  state.ui.fabricOpen=true;
  state.ui.modal='customcut';
  renderModal();
}

function pickCustomFabric(fid){
  var d=state.customDraft; if(!d) return;
  if (ownedYards(fid) + 1e-9 < CLOTH_YARDS){
    toast('You need '+CLOTH_YARDS+' yd to lay out a square of that cloth.');
    return;
  }
  d.fabricId=fid; d.cutPath=[]; d.prevPoint=null;
  state.ui.fabricOpen=false;
  renderModal();
}

function resetCustomCut(){
  var d=state.customDraft; if(!d) return;
  d.cutPath=[]; d.prevPoint=null; d.dragging=false;
  renderModal();
}

/* A free cut is usable once it is long enough and roughly closed. */
function customCutClosed(d){
  if (!d || d.cutPath.length<8) return false;
  if (pathLength(d.cutPath)<70) return false;
  var a=d.cutPath[0], b=d.cutPath[d.cutPath.length-1];
  return Math.sqrt(Math.pow(a.x-b.x,2)+Math.pow(a.y-b.y,2))<=20;
}
function customCutUsable(d){
  return d && d.cutPath.length>=8 && pathLength(d.cutPath)>=70;
}

function finishCustomItem(){
  var d=state.customDraft;
  if (!d || !d.fabricId) return;
  if (!customCutUsable(d)){ toast('Cut a bigger shape first.'); return; }

  var shaped=simplifyPath(d.cutPath, 56);
  var clip=pathToClip(shaped);
  if (!clip){ toast('That cut did not make a shape.'); return; }

  var area=polygonArea(shaped);
  var yards=clamp(Math.round((CLOTH_YARDS*area/(CLOTH*CLOTH))*4)/4, 0.25, CLOTH_YARDS);
  if (ownedYards(d.fabricId)+1e-9 < yards){ toast('Not enough fabric left.'); return; }
  state.stock[d.fabricId]-=yards;

  var f=fabricById(d.fabricId);
  var xs=shaped.map(function(p){return p.x;}), ys=shaped.map(function(p){return p.y;});
  var bw=Math.max(1,Math.max.apply(null,xs)-Math.min.apply(null,xs));
  var bh=Math.max(1,Math.max.apply(null,ys)-Math.min.apply(null,ys));
  var name=(d.name||'').trim() || ('Item #'+(state.customItems.length+1));
  var colorMatch = state.guest.wantColors.indexOf('any')!==-1 ||
                   state.guest.wantColors.indexOf(f.colorId)!==-1;

  state.customItems.push({
    id:'ci'+(state.customItems.length+1)+'_'+Math.floor(Math.random()*9999),
    name:name, fabricId:d.fabricId,
    cutShape:shaped, cutClip:clip.clip, cutAspect:clip.aspect,
    bw:bw, bh:bh, yards:yards,
    cost:f.pricePerYard*yards, colorMatch:colorMatch
  });

  state.customDraft=null;
  state.customArrange=null;   /* arrangement is rebuilt when the set changes */
  state.ui.modal='custom';
  toast(name+' cut &middot; '+yards.toFixed(2)+' yd used');
  renderModal();
}

function removeCustomItem(id){
  state.customItems=state.customItems.filter(function(i){ return i.id!==id; });
  state.customArrange=null;
  renderModal();
}

function initCustomArrange(){
  var pos={}, order=[], tf={};
  state.customItems.forEach(function(it,i){
    var w=it.bw*CUSTOM_SCALE, h=it.bh*CUSTOM_SCALE;
    pos[it.id]={ x:clamp((CSTAGE_W-w)/2,0,CSTAGE_W-w), y:clamp(20+i*72,0,CSTAGE_H-h) };
    tf[it.id]={ s:1, r:0 };     /* scale and rotation, set by the player */
    order.push(it.id);
  });
  /* order[0] is the topmost layer */
  state.customArrange={ pos:pos, order:order, tf:tf, dragging:null, ox:0, oy:0 };
}

/* Scale/rotation for a piece, tolerating arrangements made before they existed. */
function getTF(id){
  var a=state.customArrange;
  if (!a.tf) a.tf={};
  if (!a.tf[id]) a.tf[id]={ s:1, r:0 };
  return a.tf[id];
}
function tfStyle(id){
  var t=getTF(id);
  return 'transform:rotate('+t.r.toFixed(1)+'deg) scale('+t.s.toFixed(3)+'); transform-origin:50% 50%;';
}

function customItemById(id){
  for (var i=0;i<state.customItems.length;i++) if (state.customItems[i].id===id) return state.customItems[i];
  return null;
}
function customZ(id){
  var idx=state.customArrange.order.indexOf(id);
  return state.customArrange.order.length - idx;   /* first in list sits on top */
}

function buildCustomGarment(){
  var items=state.customItems;
  var cost=0, matches=0;
  items.forEach(function(it){ cost+=it.cost; if (it.colorMatch) matches++; });
  var quality = items.length ? (matches/items.length)*100 : 0;
  quality = 40 + quality*0.6;    /* an off-palette design still has some worth */
  return {
    custom:true,
    garmentId:'custom', garmentName:'Custom Design',
    parts:items.map(function(it){
      return { id:it.id, label:it.name, fabricId:it.fabricId, yards:it.yards,
               cutShape:it.cutShape, cutAspect:it.cutAspect, quality:it.colorMatch?100:40 };
    }),
    quality:quality, cost:cost, precisionAvg:null, itemCount:items.length,
    labor:items.length*15   /* design work is worth more than the cloth it used */
  };
}

function proceedCustom(){
  if (!state.customItems.length){ toast('Add at least one item first.'); return; }
  if (state.customItems.length>1){
    if (!state.customArrange) initCustomArrange();
    state.ui.modal='customasm';
  } else {
    if (!state.customArrange) initCustomArrange();
    state.cutGarment=buildCustomGarment();
    state.price=Math.round(clamp(fairPrice(),1,state.guest.budget*1.4));
    state.ui.modal='pricing';
  }
  renderModal();
}

function proceedCustomAssembly(){
  state.cutGarment=buildCustomGarment();
  state.price=Math.round(clamp(fairPrice(),1,state.guest.budget*1.4));
  state.ui.modal='pricing';
  renderModal();
}

function endCatalogDesign(){

/* Save the piece currently on the pricing table into the Exclusive catalog. */
function addExclusive(){
  var cg=state.cutGarment; if (!cg) return;
  var g=state.guest;
  var suggested = (g && g.exclusiveName) ? g.exclusiveName
               : (cg.custom ? 'Signature Piece' : cg.garmentName);
  gamePrompt({
    title:'Add to Exclusive Catalog',
    sub:'Name your signature piece',
    label:'This is how the piece will appear in your catalog.',
    value:suggested,
    okLabel:'Add to Catalog',
    onConfirm:function(name){
      name = name || (suggested + ' No.' + (state.exclusives.length+1));
      finalizeExclusive(cg, g, name);
    }
  });
}

function finalizeExclusive(cg, g, name){
  var ex={
    id:'ex'+(exclusiveSeq++),
    name: name,
    cutGarment: clone(cg),
    customItems: clone(state.customItems||[]),
    customArrange: state.customArrange ? clone(state.customArrange) : null,
    cost: cg.cost, quality: cg.quality,
    value: Math.round(baseValue(cg)*(1.2+cg.quality/100))
  };
  state.exclusives.push(ex);
  toast('Added to the Exclusive catalog.');
  if (g && g.catalogDesign){
    endCatalogDesign();
    state.ui.modal='catalog'; state.ui.catalogTab='ex';
    renderAll();
  } else {
    renderModal();   /* keep the pricing table open so the sale can still happen */
  }

function removeExclusive(id){

  renderModal();
}

function renameExclusive(id){

/* Render a saved exclusive by briefly lending its pieces to the shared art code. */
function exclusiveArt(ex){

  state.customArrange=ex.customArrange||null;
