/* ---- Donations from the clearance rack ---- */
var DONATE_REP = 4;   /* one fifth of a star (a star spans 20 reputation) */

function toggleDonate(id){
  var sel=state.ui.donateSel||[];
  var at=sel.indexOf(id);
  if (at!==-1){ sel.splice(at,1); }
  else if (sel.length<5){ sel.push(id); }
  else { toast('You can donate up to 5 pieces at a time.'); return; }
  state.ui.donateSel=sel;
  renderModal();
}

function confirmDonate(){
  var sel=state.ui.donateSel||[];
  if (!sel.length) return;
  var n=0;
  state.rack=state.rack.filter(function(r){
    if (sel.indexOf(r.id)!==-1){ n++; return false; }
    return true;
  });
  state.reputation=clamp(state.reputation + n*DONATE_REP, 0, 100);
  state.ui.donateMode=false; state.ui.donateSel=[];
  var stars=(n*DONATE_REP/20).toFixed(1);
  toast('Donated '+n+' piece'+(n===1?'':'s')+' &middot; reputation up '+stars+' star'+(stars==='1.0'?'':'s')+'.');
  renderAll();
}

/* ---------- SVG piece rendering ----------
   Pieces are drawn as real polygons filled with the fabric and stroked black,
   so only the cut-out itself shows and its edges read cleanly. */

var svgSeq=0;
function svgPatternDef(uid,f){
  var base=f.hex, light=lighten(base,22), dark=darken(base,20);
  switch(f.patternId){
    case 'stripes':
      return '<pattern id="'+uid+'" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
             '<rect width="12" height="12" fill="'+base+'"/><rect width="6" height="12" fill="'+light+'"/></pattern>';
    case 'dots':
      return '<pattern id="'+uid+'" width="14" height="14" patternUnits="userSpaceOnUse">'+
             '<rect width="14" height="14" fill="'+base+'"/>'+
             '<circle cx="3.5" cy="3.5" r="2.4" fill="'+light+'"/><circle cx="10.5" cy="10.5" r="2.4" fill="'+light+'"/></pattern>';
    case 'plaid':
      return '<pattern id="'+uid+'" width="16" height="16" patternUnits="userSpaceOnUse">'+
             '<rect width="16" height="16" fill="'+base+'"/>'+
             '<rect width="16" height="3" y="6" fill="'+dark+'" opacity="0.55"/>'+
             '<rect width="3" height="16" x="6" fill="'+dark+'" opacity="0.55"/></pattern>';
    default:
      return '<pattern id="'+uid+'" width="8" height="8" patternUnits="userSpaceOnUse">'+
             '<rect width="8" height="8" fill="'+base+'"/></pattern>';
  }
}

/* points: [{x,y}] in any units. Normalised into a w x h box, inset so the
   black stroke is never clipped by the SVG edge. */
function piecePolySVG(fabricId, points, w, h, strokeW){
  var f=fabricById(fabricId);
  if (!f || !points || points.length<3) return '';
  var sw=strokeW===undefined?2:strokeW;
  var xs=points.map(function(p){return p.x;}), ys=points.map(function(p){return p.y;});
  var minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
  var minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  var bw=Math.max(0.001,maxX-minX), bh=Math.max(0.001,maxY-minY);
  var iw=Math.max(1,w-sw), ih=Math.max(1,h-sw);
  var uid='sp'+(++svgSeq);
  var poly=points.map(function(p){
    return (sw/2+(p.x-minX)/bw*iw).toFixed(1)+','+(sw/2+(p.y-minY)/bh*ih).toFixed(1);
  }).join(' ');
  return '<svg class="piece-svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
    '<defs>'+svgPatternDef(uid,f)+'</defs>'+
    '<polygon points="'+poly+'" fill="url(#'+uid+')" stroke="#0b0a09" stroke-width="'+sw+'" stroke-linejoin="round"/>'+
  '</svg>';
}

/* Fall back to the ideal pattern outline if a cut shape is somehow missing. */
function shapePoints(shapeKey){
  return SHAPES[shapeKey].points.map(function(p){ return {x:p[0], y:p[1]}; });
}

/* ============================= ASSEMBLY ============================= */

function layoutFor(gid,pid){
  if (ASSEMBLY_LAYOUTS[gid] && ASSEMBLY_LAYOUTS[gid][pid]) return ASSEMBLY_LAYOUTS[gid][pid];
  return SINGLE_LAYOUT;
}

/* Fit a cut piece inside its slot without distorting the shape the player cut:
   a sloppy, lopsided cut stays lopsided on the mannequin. */
function fitCutBox(layout, aspect){
  if (!aspect || !isFinite(aspect) || aspect<=0) return { w:layout.w, h:layout.h, dx:0, dy:0 };
  var w=layout.w, h=w/aspect;
  if (h>layout.h){ h=layout.h; w=h*aspect; }
  return { w:w, h:h, dx:(layout.w-w)/2, dy:(layout.h-h)/2 };
}

function initAssemblyState(){
  var g=state.guest, pos={}, placed={};
  g.garment.parts.forEach(function(p,i){
    var l=layoutFor(g.garment.id,p.id);
    pos[p.id]={ x:clamp(14+(i%2)*146+rnd(-5,5),0,290-l.w), y:clamp(376+i*14+rnd(-3,3),0,450-28) };
    placed[p.id]=false;
  });
  state.assembly={ positions:pos, placed:placed, dragging:null, ox:0, oy:0 };
}

function assemblyAllPlaced(){
  return state.guest.garment.parts.every(function(p){ return state.assembly.placed[p.id]; });
}

function initAssemblyDrag(stage){
  Array.prototype.forEach.call(stage.querySelectorAll('.apiece'), function(el){
    if (el.classList.contains('locked')) return;
    el.addEventListener('pointerdown', function(e){
      e.preventDefault();
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
      var r=stage.getBoundingClientRect(), sx=290/r.width, sy=450/r.height;
      var pid=el.getAttribute('data-part'), pos=state.assembly.positions[pid];
      state.assembly.dragging=pid;
      state.assembly.ox=(e.clientX-r.left)*sx-pos.x;
      state.assembly.oy=(e.clientY-r.top)*sy-pos.y;
      el.style.zIndex=99;
    });
  });
  stage.addEventListener('pointermove', function(e){
    var pid=state.assembly.dragging; if(!pid) return;
    e.preventDefault();
    var r=stage.getBoundingClientRect(), sx=290/r.width, sy=450/r.height;
    var l=layoutFor(state.guest.garment.id,pid);
    var st=state.cutting[pid], box=fitCutBox(l, st?st.cutAspect:null);
    var x=clamp((e.clientX-r.left)*sx-state.assembly.ox,0,290-l.w);
    var y=clamp((e.clientY-r.top)*sy-state.assembly.oy,0,450-l.h);
    state.assembly.positions[pid]={x:x,y:y};
    var el=stage.querySelector('.apiece[data-part="'+pid+'"]');
    /* the element is centred inside its slot, so keep that offset while dragging */
    if (el){ el.style.left=(x+box.dx)+'px'; el.style.top=(y+box.dy)+'px'; }
  });
  function end(){
    var pid=state.assembly.dragging; if(!pid) return;
    state.assembly.dragging=null;
    var l=layoutFor(state.guest.garment.id,pid), pos=state.assembly.positions[pid];
    var d=Math.sqrt(Math.pow(pos.x+l.w/2-(l.x+l.w/2),2)+Math.pow(pos.y+l.h/2-(l.y+l.h/2),2));
    if (d<=55){
      state.assembly.positions[pid]={x:l.x,y:l.y};
      state.assembly.placed[pid]=true;
      renderModal();
    } else {
      var el=stage.querySelector('.apiece[data-part="'+pid+'"]');
      if (el) el.style.zIndex=String(l.z||1);
    }
  }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
}

/* ============================= ORDER FLOW ============================= */

function acceptTicket(tid){
  if (state.guest){ toast('Finish the current order first.'); return; }
  var idx=-1;
  for (var i=0;i<state.tickets.length;i++) if (state.tickets[i].id===tid) idx=i;
  if (idx===-1) return;
  var t=state.tickets[idx];
  state.tickets.splice(idx,1);

  /* Exclusive order: the piece is already designed, so jump straight to pricing. */
  if (t.exclusiveId){
    var ex=exclusiveById(t.exclusiveId);
    if (!ex){ toast('That design is no longer in the catalog.'); renderAll(); return; }
    state.guest=t;
    state.guest.garment={ id:'exclusive', name:ex.name };
    state.customItems=clone(ex.customItems||[]);
    state.customArrange=ex.customArrange?clone(ex.customArrange):null;
    state.cutGarment=clone(ex.cutGarment);
    state.cutting={}; state.assembly=null; state.customDraft=null; state.lastResult=null;
    state.price=Math.round(clamp(fairPrice(),1,t.budget*1.4));
    state.ui.modal='pricing'; state.ui.tracePart=null;
    renderAll();
    return;
  }

  state.guest=t;
  state.cutting={}; state.assembly=null; state.cutGarment=null; state.price=0; state.lastResult=null;
  state.customItems=[]; state.customDraft=null; state.customArrange=null;
  state.ui.modal=state.guest.custom ? 'custom' : 'cutting';
  state.ui.tracePart=null;
  renderAll();
}

function declineTicket(tid){
  state.tickets=state.tickets.filter(function(t){ return t.id!==tid; });
  state.reputation=clamp(state.reputation-1,0,100);
  state.ui.modal=null;
  renderAll();
}

function buildCutGarment(){
  var g=state.guest;
  var parts=g.garment.parts.map(function(p){
    var st=state.cutting[p.id];
    return { id:p.id, label:p.label, fabricId:st.fabricId, yards:p.yards, weight:p.weight,
             quality:st.finalQuality, precision:st.precision,
             cutShape:st.cutShape, cutClip:st.cutClip, cutAspect:st.cutAspect };
  });
  var w=0,tot=0,cost=0,prec=0;
  parts.forEach(function(p){
    tot+=p.quality*p.weight; w+=p.weight;
    cost+=fabricById(p.fabricId).pricePerYard*p.yards;
    prec+=p.precision;
  });
  return { garmentId:g.garment.id, garmentName:g.garment.name, parts:parts,
           quality:w?tot/w:0, cost:cost, precisionAvg:prec/parts.length };
}

/* What the piece is worth before the player marks it up. */
function baseValue(cg){ return cg.cost + (cg.labor||0); }
function fairPrice(){ var c=state.cutGarment; return baseValue(c)*(1.2+c.quality/100); }

/* ---- Selling Help colour cues (green = likely, brass = risky, red = won't sell) ---- */
function qualityColor(q){ return q>=68?'var(--good)':(q>=52?'var(--brass)':'var(--bad)'); }
function precisionColor(p){
  if (!settings.precisionMatters) return 'var(--good)';   /* precision can't lose the sale when the rule is off */
  return p>=85?'var(--good)':(p>=65?'var(--brass)':'var(--bad)');
}
function priceIndicatorColor(){
  var g=state.guest, cg=state.cutGarment;
  if (!g || !cg) return 'var(--ink)';
  var fp=fairPrice(), isCat=g.catalogDesign;
  if (!isCat && state.price>g.budget) return 'var(--bad)';   /* over budget = lost outright */
  if (state.price<=fp) return 'var(--good)';                 /* at or under fair = best odds */
  if (isCat) return 'var(--brass)';
  return state.price<=g.budget ? 'var(--brass)' : 'var(--bad)';
}

function proceedFromCutting(){
  var g=state.guest;
  if (!g.garment.parts.every(function(p){ return state.cutting[p.id] && state.cutting[p.id].done; })){
    toast('Every piece must be cut first.'); return;
  }
  state.cutGarment=buildCutGarment();
  if (g.garment.parts.length>1){ initAssemblyState(); state.ui.modal='assembly'; }
  else { state.price=Math.round(clamp(fairPrice(),1,g.budget*1.4)); state.ui.modal='pricing'; }
  renderModal();
}

function proceedFromAssembly(){
  if (!assemblyAllPlaced()){ toast('Place every piece in its outline.'); return; }
  state.price=Math.round(clamp(fairPrice(),1,state.guest.budget*1.4));
  state.ui.modal='pricing';
  renderModal();
}

function presentToGuest(){
  var g=state.guest, price=state.price, q=state.cutGarment.quality, pf;
  if (price>g.budget) pf=0;
  else {
    var fp=baseValue(state.cutGarment)*(1.2+q/100);
    pf=clamp(1-Math.max(0,(price/fp)-1)*0.6,0,1);
  }
  var sat=q*pf, accepted=(sat+rnd(-6,6))>=55;

  /* Precision Matters (opt-in): cutting accuracy becomes a hard gate on the sale.
     85%+ always satisfies, under 65% is an automatic no-sale, and the 65-85 band
     is judged against a random per-customer standard so 72% beats 69% on average
     but either can pass or fail on the day. */
  var precAvg=state.cutGarment.precisionAvg, precFail=false, precStandard=null;
  if (settings.precisionMatters && precAvg!=null){
    if (precAvg>=85){ precFail=false; }
    else if (precAvg<65){ precFail=true; }
    else { precStandard=65+rnd(0,20); precFail=(precAvg<precStandard); }
    if (precFail) accepted=false;
  }

  /* Collect every reason the piece missed, for the walk-away explanation. */
  var reasons=[];
  if (!accepted){
    var wantAnyColor=g.wantColors.indexOf('any')!==-1;
    var colorMiss=0, patternMiss=0;
    state.cutGarment.parts.forEach(function(p){
      var f=fabricById(p.fabricId); if (!f) return;
      if (!wantAnyColor && g.wantColors.indexOf(f.colorId)===-1) colorMiss++;
      if (g.wantPattern!=='any' && g.wantPattern!==f.patternId) patternMiss++;
    });
    if (colorMiss>0)   reasons.push('Color &mdash; the fabric wasn&rsquo;t in the color they asked for.');
    if (patternMiss>0) reasons.push('Pattern &mdash; the pattern didn&rsquo;t match their request.');
    if (settings.precisionMatters && precFail){
      reasons.push('Precision &mdash; the cutting was too imprecise ('+Math.round(precAvg)+'%'+
        (precStandard!=null?', short of their '+Math.round(precStandard)+'% standard':'')+').');
    }
    if (price>g.budget) reasons.push('Price &mdash; '+money(price)+' was over their '+money(g.budget)+' budget.');
    else if (pf<0.85)   reasons.push('Price &mdash; '+money(price)+' felt steep for the quality.');
    if (!reasons.length) reasons.push('Their taste was simply particular today.');
  }

  var repDelta=clamp(Math.round((sat-55)/9),-5,5);
  if (!accepted) repDelta=clamp(repDelta,-5,0);   /* a rejected sale never raises reputation */
  state.reputation=clamp(state.reputation+repDelta,0,100);

  if (accepted){
    state.cash+=price; state.totalSales+=price; state.guestsServed++;
    state.dayStats.sold++; state.dayStats.earned+=price;
  } else {
    state.dayStats.declined++;
    state.rack.push({
      id:'r'+(rackSeq++),
      garmentId:state.cutGarment.garmentId,
      garmentName:state.cutGarment.garmentName,
      quality:q,
      value:Math.round(baseValue(state.cutGarment)*0.55),
      parts:state.cutGarment.parts.map(function(p){ return { fabricId:p.fabricId, yards:p.yards }; })
    });
  }
  state.lastResult={ accepted:accepted, price:price, quality:q, repDelta:repDelta,
                     garmentName:state.cutGarment.garmentName, guestName:g.name, reasons:reasons };
  state.ui.modal='result';
  renderModal();
}

function finishOrder(){
  state.guest=null; state.cutting={}; state.assembly=null;
  state.customItems=[]; state.customDraft=null; state.customArrange=null;
  state.ui.modal=null; state.ui.tracePart=null;
  if (state.closingPending) endDay();
  else renderAll();
}

/* ============================= CLEARANCE ============================= */

function sellRackItem(rid){
  var it=null;
  state.rack=state.rack.filter(function(r){ if(r.id===rid){ it=r; return false; } return true; });
  if (!it) return;
  state.cash+=it.value; state.totalSales+=it.value;
  toast('Sold ' + it.garmentName + ' for ' + money(it.value) + '.');
  renderAll();
}

function recycleRackItem(rid){
  var it=null;
  state.rack=state.rack.filter(function(r){ if(r.id===rid){ it=r; return false; } return true; });
  if (!it) return;
  var recovered=0;
  it.parts.forEach(function(p){
    var back=Math.round(p.yards*0.5*2)/2;   /* half the yardage back, to the nearest 0.5 */
    state.stock[p.fabricId]=(state.stock[p.fabricId]||0)+back;
    recovered+=back;
  });
  toast('Recycled &middot; ' + recovered.toFixed(1) + ' yd returned to stock.');
  renderAll();
}

function sellAllRack(){
  if (!state.rack.length) return;
  var sum=state.rack.reduce(function(s,r){ return s+r.value; },0);
  state.cash+=sum; state.totalSales+=sum; state.rack=[];
  toast('Rack cleared for ' + money(sum) + '.');
  renderAll();
}

function buyFabric(fid, yards){
  var f=fabricById(fid), cost=f.pricePerYard*yards;
  if (state.cash<cost){ toast('Not enough cash.'); return; }
  state.cash-=cost;
  state.stock[fid]=(state.stock[fid]||0)+yards;
  toast('Ordered ' + yards + ' yd of ' + f.colorName + ' ' + f.patternName + '.');
  renderAll();
}

/* ============================= DAY CYCLE ============================= */

function openStore(){
  state.phase='open';
  state.clock=OPEN_MIN;
  state.tickets=[];
  state.closingPending=false;
  state.dayStats={ sold:0, earned:0, declined:0, expired:0, repStart:state.reputation };
  state.nextSpawnAt=OPEN_MIN+4;
  lastTickMs=Date.now();
  startClock();
  renderAll();
}

function startClock(){
  stopClock();
  clockTimer=setInterval(tick, 200);
}
function stopClock(){
  if (clockTimer){ clearInterval(clockTimer); clockTimer=null; }
}

function clockPaused(){
  /* meta screens pause the day; crafting does not, so the workday stays meaningful */
  var m=state.ui.modal;
  return m==='menu' || m==='summary' || m==='result';
}

function tick(){
  var now=Date.now(), dt=now-(lastTickMs||now);
  lastTickMs=now;
  if (state.phase!=='open') return;
  if (clockPaused()) return;

  state.clock=Math.min(CLOSE_MIN, state.clock + dt*minPerMs());

  var changed=false;

  /* new orders arrive until an hour before close */
  if (state.clock>=state.nextSpawnAt && state.clock<CLOSE_MIN-40 && activeOrderCount()<MAX_ORDERS){
    spawnTicket();
    state.nextSpawnAt=state.clock+rnd(28,55);
    changed=true;
  }

  /* impatient guests leave, only when the patience option is on */
  if (settings.patience){
    var before=state.tickets.length;
    state.tickets=state.tickets.filter(function(t){
      return (state.clock - t.arrivedAt) < t.patience;
    });
    if (state.tickets.length!==before){
      var lost=before-state.tickets.length;
      state.dayStats.expired+=lost;
      state.reputation=clamp(state.reputation-lost,0,100);
      changed=true;
    }
  }

  if (state.clock>=CLOSE_MIN){
    if (state.guest){ state.closingPending=true; }
    else { endDay(); return; }
  }

  updateClockUI();
  if (changed) renderTray();
}

function endDay(){
  stopClock();
  state.phase='summary';
  state.closingPending=false;
  state.tickets=[];
  state.ui.modal='summary';
  renderAll();
}

function nextDay(){
  state.day++;
  state.phase='closed';
  state.clock=OPEN_MIN;
  state.ui.modal=null;
  renderAll();
}

/* ============================= SAVE / LOAD ============================= */

function saveGame(){
  var data={
    v:2, day:state.day, cash:state.cash, reputation:state.reputation,
    guestsServed:state.guestsServed, totalSales:state.totalSales,
    stock:state.stock, rack:state.rack, rackSeq:rackSeq,
    exclusives:state.exclusives, catalogOff:state.catalogOff, exclusiveSeq:exclusiveSeq
  };
  try{
    window.localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    toast('Game saved.');
    return true;
  }catch(e){
    toast('Could not save &mdash; storage is blocked here.');
    return false;
  }
}

function hasSave(){
  try{ return !!window.localStorage.getItem(SAVE_KEY); }catch(e){ return false; }
}

function loadGame(){
  var raw;
  try{ raw=window.localStorage.getItem(SAVE_KEY); }
  catch(e){ toast('Could not read storage.'); return; }
  if (!raw){ toast('No saved game found.'); return; }
  var d;
  try{ d=JSON.parse(raw); }catch(e){ toast('Save file is unreadable.'); return; }

  stopClock();
  state=freshState();
  state.day=d.day||1;
  state.cash=typeof d.cash==='number'?d.cash:150;
  state.reputation=typeof d.reputation==='number'?d.reputation:50;
  state.guestsServed=d.guestsServed||0;
  state.totalSales=d.totalSales||0;
  state.stock=d.stock||{};
  state.rack=Array.isArray(d.rack)?d.rack:[];
  rackSeq=d.rackSeq||(state.rack.length+1);
  state.exclusives=Array.isArray(d.exclusives)?d.exclusives:[];
  state.catalogOff=d.catalogOff||{};
  exclusiveSeq=d.exclusiveSeq||(state.exclusives.length+1);
  state.phase='closed';
  state.ui.modal=null;
  toast('Game loaded &mdash; Day ' + state.day + '.');
  renderAll();
}

function newGame(){
  stopClock();
  state=freshState();
  ticketSeq=1; rackSeq=1; exclusiveSeq=1;
  toast('New game started.');
  renderAll();
}

      '<div class="stat clockstat"><div class="k">Day '+state.day+'</div><div class="v" id="hud-time">'+fmtClock(state.clock)+'</div></div>'+

/* ============================= RENDER: SCENE ============================= */

function renderScene(){
  var rackBadge = state.rack.length ? '<span class="hs-badge">'+state.rack.length+'</span>' : '';

  var veil='';
  if (state.phase==='closed'){
    veil='<div class="open-veil">'+
      '<div class="open-card">'+
        '<h3>Day '+state.day+'</h3>'+
        '<p>Doors open at 10:00 AM and close at 5:00 PM. Stock up on fabric before you start.</p>'+
        '<button class="btn good" data-act="open-store">Open the Shop</button>'+
        '<button class="btn" data-act="shop">Order Fabric First</button>'+
      '</div>'+
    '</div>';
  }

  document.getElementById('scene').innerHTML =
    '<div id="scene-stage">'+
      '<img id="scene-img" src="'+SCENE_IMG+'" alt="Seamstress atelier" draggable="false">'+
      /* spool row on the shelf top -> fabric ordering */
      '<button class="hotspot" data-act="shop" style="left:33.5%; top:17.6%; width:30%; height:7%;">'+
        '<span class="hs-label">Order Fabric</span>'+
      '</button>'+
      /* wooden cubby carcass with the folded clothes -> clearance rack */
      '<button class="hotspot" data-act="clearance" style="left:18.5%; top:24.8%; width:57%; height:17.7%;">'+
        '<span class="hs-label">Clearance Rack'+ rackBadge +'</span>'+
      '</button>'+
      /* pinned dress design cards on the right wall -> catalog */
      '<button class="hotspot" data-act="catalog" style="left:72%; top:7.5%; width:25%; height:14.5%;">'+
        '<span class="hs-label">Catalog'+ (state.exclusives.length?'<span class="hs-badge">'+state.exclusives.length+'</span>':'') +'</span>'+
      '</button>'+
    '</div>'+
    veil;

  fitScene();
}

/* Sizes the stage so the shelf and cubby stay fully on screen at any viewport,
   while the aspect-locked stage keeps hotspots pinned to the artwork. */
var IMG_RATIO = 1.79082;           /* image height / width */
var SCENE_VISIBLE = 0.44;          /* fraction of image height that must remain visible */
function fitScene(){
  var scene=document.getElementById('scene');
  var stage=document.getElementById('scene-stage');
  if (!scene || !stage) return;
  var availW=scene.clientWidth, availH=scene.clientHeight;
  if (!availW || !availH) return;
  var maxW=availH/(IMG_RATIO*SCENE_VISIBLE);
  stage.style.width=Math.max(160, Math.min(availW, maxW))+'px';
}

function updateClockUI(){
  var t=document.getElementById('hud-time');
  if (t) t.textContent=fmtClock(state.clock);
}

/* ============================= RENDER: TRAY ============================= */

function renderTray(){
  var el=document.getElementById('tray'), inner;

  if (state.phase!=='open' && !state.guest){
    inner='<div class="tray-empty">'+(state.phase==='summary'?'The shop is closed for the day.':'Open the shop to take orders.')+'</div>';
  } else if (!state.guest && !state.tickets.length){
    inner='<div class="tray-empty">No guests waiting right now.</div>';
  } else {
    var cards=[];
    if (state.guest){
      cards.push('<button class="order-ticket working" data-act="resume">'+
        '<div class="ot-tag">In progress</div>'+
        '<div class="ot-name">'+esc(state.guest.name)+'</div>'+
        '<div class="ot-req">'+esc(state.guest.garment.name)+'</div>'+
      '</button>');
    }
    state.tickets.forEach(function(t){
      var bar='';
      if (settings.patience){
        var left=clamp(100-((state.clock-t.arrivedAt)/t.patience*100),0,100);
        bar='<div class="ot-patience"><i style="width:'+left+'%"></i></div>';
      }
      cards.push('<button class="order-ticket" data-act="ticket" data-id="'+t.id+'">'+
        '<div class="ot-name">'+esc(t.name)+'</div>'+
        '<div class="ot-req">'+esc(t.garment.name)+'</div>'+ bar +
      '</button>');
    });
    inner='<div class="tray-scroll'+(cards.length<3?' center':'')+'">'+cards.join('')+'</div>';
  }

  el.innerHTML='<div class="tray-head">Order Tickets &middot; '+activeOrderCount()+' / '+MAX_ORDERS+'</div>'+inner;
}

/* ============================= RENDER: MODALS ============================= */

function modalShell(title, sub, bodyHtml, full, cls){
  return '<div class="modal-veil" data-veil="1">'+
    '<div class="modal'+(full?' full':'')+(cls?' '+cls:'')+'">'+
      '<div class="modal-head">'+
        '<div><h3>'+title+'</h3>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'+
        '<button class="x-btn" data-act="close-modal">&times;</button>'+
      '</div>'+
      '<div class="modal-body">'+bodyHtml+'</div>'+
    '</div>'+
  '</div>';
}

function bodyShop(){
  var openId=state.ui.shopColor;
  var groups=COLORS.map(function(c){
    var isOpen=openId===c.id;
    var owned=0;
    FABRICS.forEach(function(f){ if (f.colorId===c.id) owned+=ownedYards(f.id); });
    var head='<button class="shop-color'+(isOpen?' open':'')+'" data-act="shop-color" data-id="'+c.id+'" aria-expanded="'+(isOpen?'true':'false')+'">'+
        '<span class="sw" style="background:'+c.hex+'"></span>'+
        '<span class="nm">'+c.name+
          '<small>'+(owned>0?'in stock '+owned.toFixed(1)+' yd':'tap to order')+'</small></span>'+
        '<span class="chev">'+(isOpen?'&minus;':'+')+'</span>'+
      '</button>';
    var drop='';
    if (isOpen){
      var rows=FABRICS.filter(function(f){ return f.colorId===c.id; }).map(function(f){
        var afford=state.cash>=f.pricePerYard*2;
        return '<div class="shop-row">'+
          '<div class="sw" style="background:'+swatchBg(f)+'"></div>'+
          '<div class="nm">'+f.patternName+
            '<small>'+money(f.pricePerYard)+' / yd &middot; in stock '+ownedYards(f.id).toFixed(1)+' yd</small></div>'+
          '<button class="buy" data-act="buy" data-id="'+f.id+'" '+(afford?'':'disabled')+'>+2 yd<br>'+money(f.pricePerYard*2)+'</button>'+
        '</div>';
      }).join('');
      drop='<div class="shop-drop">'+rows+'</div>';
    }
    return '<div class="shop-group'+(isOpen?' open':'')+'">'+head+drop+'</div>';
  }).join('');
  return '<div class="hint" style="margin-top:0;">Pick a colour to reveal its Solid, Stripes, and Polka Dot bolts. Fabric is bought by the yard.</div>'+groups;
}

function rackChips(r){
  return r.parts.map(function(p){
    var f=fabricById(p.fabricId);
    return '<span class="ri-chip"><span class="dot" style="background:'+swatchBg(f)+'"></span>'+

function bodyClearance(){
  if (!state.rack.length){
    return '<div class="empty">The rack is empty. Garments a guest turns down end up here.</div>';
  }
  if (state.ui.donateMode) return donateBody();
  var items=state.rack.map(function(r){
    return '<div class="rack-item">'+
      '<div class="ri-top"><span class="ri-name">'+r.garmentName+'</span><span class="ri-q">'+Math.round(r.quality)+'% match</span></div>'+
      '<div class="ri-fab">'+rackChips(r)+'</div>'+
      '<div class="btn-row">'+
        '<button class="btn good" data-act="sell-item" data-id="'+r.id+'">Sell '+money(r.value)+'</button>'+
        '<button class="btn" data-act="recycle-item" data-id="'+r.id+'">Recycle Fabric</button>'+
      '</div>'+
    '</div>';
  }).join('');
  var total=state.rack.reduce(function(s,r){ return s+r.value; },0);
  return '<div class="hint" style="margin-top:0;">Sell a piece for cash, or recycle it to recover half its yardage back into your stock.</div>'+
    items+
    '<button class="btn primary" data-act="sell-all">Sell Everything &middot; '+money(total)+'</button>'+
    '<button class="btn" data-act="donate-start">Donate to Charity</button>';

function donateBody(){
  var sel=state.ui.donateSel||[];
  var items=state.rack.map(function(r){
    var on=sel.indexOf(r.id)!==-1;
    return '<div class="rack-item don'+(on?' sel':'')+'" data-act="donate-toggle" data-id="'+r.id+'">'+
      '<div class="ri-top"><span class="ri-name">'+r.garmentName+'</span>'+
        '<span class="don-check">'+(on?'&check;':'')+'</span></div>'+
      '<div class="ri-fab">'+rackChips(r)+'</div>'+
    '</div>';
  }).join('');

  return '<div class="hint" style="margin-top:0;">Pick up to 5 pieces to donate. Each one lifts your reputation by a fifth of a star.</div>'+
    '<div class="don-count">'+sel.length+' / 5 selected &middot; +'+stars+' star'+(stars==='1.0'?'':'s')+'</div>'+
    items+
    '<button class="btn primary" data-act="donate-confirm" '+(sel.length?'':'disabled')+'>Donate '+sel.length+' Piece'+(sel.length===1?'':'s')+'</button>'+
    '<button class="btn" data-act="donate-cancel">Cancel</button>';
}

function bodyCatalog(){
  var tab=state.ui.catalogTab||'std';
  var tabs='<div class="cat-tabs">'+
      '<button class="cat-tab'+(tab==='std'?' on':'')+'" data-act="catalog-tab" data-id="std">Standard</button>'+
      '<button class="cat-tab'+(tab==='ex'?' on':'')+'" data-act="catalog-tab" data-id="ex">Exclusives</button>'+
    '</div>';

      '</div>'+
      (state.guest ? '<div class="hint">Finish the current order first.</div>' : '')+

          '<div class="dc-block"><div class="lbl">Brief</div><div class="note">No pattern and no garment type &mdash; design whatever you like. Add one or more pieces, cut any shapes, arrange them, and name your price.</div></div>'+
        '</div>'+
      '</div>'+
      (state.guest ? '<div class="hint">You are already working an order.</div>' : '')+

        '<div class="dc-block"><div class="lbl">Preferred Pattern</div><span class="pref-chip">'+pat+'</span></div>'+

        '<div class="dc-block"><div class="lbl">Pattern Pieces</div><div class="note">'+pieces+'</div></div>'+
      '</div>'+
    '</div>'+
    (state.guest ? '<div class="hint">You are already working an order. Finish it before taking another.</div>' : '')+
    '<button class="btn good" data-act="accept" data-id="'+t.id+'" '+(state.guest?'disabled':'')+'>Accept Order</button>'+
    '<button class="btn bad" data-act="decline" data-id="'+t.id+'">Turn Away</button>';

/* Compact reminder of what the guest asked for, shown wherever fabric gets chosen. */
function requirementStrip(){
  var g=state.guest;
  if (!g) return '';
  var chips=g.wantColors.map(function(cid){
    if (cid==='any') return '<span class="pref-chip sm">Any color</span>';
    var c=COLORS.filter(function(x){ return x.id===cid; })[0];
    return '<span class="pref-chip sm"><span class="dot" style="background:'+c.hex+'"></span>'+c.name+'</span>';
  }).join('');
  var pat = g.wantPattern==='any' ? 'Any pattern' : PATTERNS.filter(function(p){ return p.id===g.wantPattern; })[0].name;
  return '<div class="req-strip">'+
    '<div class="rs-name">'+esc(g.name)+' wants</div>'+
    '<div class="rs-line"><span class="rs-k">Colors</span><span class="rs-v">'+chips+'</span></div>'+
    '<div class="rs-line"><span class="rs-k">Pattern</span><span class="rs-v"><span class="pref-chip sm">'+pat+'</span></span></div>'+
    '<div class="rs-line"><span class="rs-k">Budget</span><span class="rs-v rs-budget">'+money(g.budget)+'</span></div>'+

}

function bodyCutting(){
  var g=state.guest, q=currentOverallQuality();
  var col=q.pct>=75?'var(--good)':(q.pct>=45?'var(--brass)':'var(--bad)');
  var btns=g.garment.parts.map(function(p){
    var st=state.cutting[p.id], cls, lbl, sw='';
    if (st && st.done){ cls='done'; lbl='&check; Cut &middot; '+Math.round(st.precision)+'% precision'; }
    else if (st && st.fabricId){ cls='progress'; lbl=Math.round(piecePercentCut(st))+'% cut'; }
    else { cls='pending'; lbl='Not started'; }
    if (st && st.fabricId) sw='<span class="pb-sw" style="background:'+swatchBg(fabricById(st.fabricId))+'"></span>';
    return '<button class="piece-btn" data-act="open-piece" data-part="'+p.id+'">'+
      '<div class="pb-title">'+p.label+'</div>'+
      '<div class="pb-yards">needs '+p.yards+' yd</div>'+
      '<span class="pb-status '+cls+'">'+sw+lbl+'</span>'+
    '</button>';
  }).join('');
  var all=g.garment.parts.every(function(p){ return state.cutting[p.id] && state.cutting[p.id].done; });
  var next=g.garment.parts.length>1?'Go to Assembly':'Price This Piece';
  return requirementStrip()+
    '<div class="hint" style="margin-top:0;">Tap a piece to pick its fabric and cut it out on the table.</div>'+
    btns+
    '<div class="quality-row"><span class="lbl">Overall Match</span>'+
      '<div class="wrap"><i style="width:'+q.pct+'%; background:'+col+';"></i></div>'+
      '<div class="pct">'+Math.round(q.pct)+'%</div></div>'+
    '<button class="btn primary" data-act="proceed-cut" '+(all?'':'disabled')+'>'+next+'</button>'+
    '<button class="btn" data-act="abandon">Abandon This Order</button>';
}

function bodyTrace(){
  var pid=state.ui.tracePart;
  var part=partOf(state.guest.garment,pid), st=state.cutting[pid];
  var g=state.guest;
  var hasFabric = st && st.fabricId;
  var open = state.ui.fabricOpen || !hasFabric;

  /* compact reminder of the guest's request */
  var wantChips=g.wantColors.map(function(cid){
    if (cid==='any') return '<span class="pref-chip sm">Any color</span>';
    var c=COLORS.filter(function(x){ return x.id===cid; })[0];
    return '<span class="pref-chip sm"><span class="dot" style="background:'+c.hex+'"></span>'+c.name+'</span>';
  }).join('');
  var patName = g.wantPattern==='any' ? 'Any pattern' : PATTERNS.filter(function(p){ return p.id===g.wantPattern; })[0].name;
  var req='<div class="trace-req">'+
      '<span class="tr-k">Wants</span>'+wantChips+
      '<span class="pref-chip sm">'+patName+'</span>'+
      '<span class="tr-k">Up to</span><span class="tr-b">'+money(g.budget)+'</span>'+
    '</div>';

  /* fabric picker: full grid, or collapsed to a single chip once chosen */
  var fabricZone;
  if (st && st.done){
    fabricZone='';
  } else if (open){
    var grid=FABRICS.map(function(f){
      var avail=ownedYards(f.id)-reservedYards(f.id,pid);
      var can=avail+1e-9>=part.yards;
      var sel=hasFabric && st.fabricId===f.id;
      return '<button class="fab-sw'+(sel?' sel':'')+'" style="background:'+swatchBg(f)+'" '+
        'data-act="pick-fabric" data-part="'+pid+'" data-id="'+f.id+'" '+(can?'':'disabled')+
        ' title="'+f.colorName+' '+f.patternName+' &middot; '+avail.toFixed(1)+'yd"></button>';
    }).join('');
    fabricZone='<div class="fabric-zone">'+
        '<div class="chip-label">Choose Fabric</div>'+
        '<div class="fabric-grid">'+grid+'</div>'+
      '</div>';
  } else {
    var f=fabricById(st.fabricId);
    fabricZone='<div class="fabric-zone">'+
        '<button class="fab-toggle" data-act="toggle-fabric">'+
          '<span class="sw" style="background:'+swatchBg(f)+'"></span>'+
          f.colorName+' '+f.patternName+
          '<span class="caret">&#9660; change</span>'+
        '</button>'+
      '</div>';
  }

  /* stage + footer */
  var stage, foot;
  if (!hasFabric){
    stage='<div class="trace-stage"><div class="chip-label">Pick a fabric to lay out the cloth</div></div>';
    foot='';
  } else if (st.done){
    stage='<div class="trace-stage"><div class="done-card">'+
        '<div class="h">Piece Cut</div>'+
        '<div class="p">Precision '+Math.round(st.precision)+'%</div>'+
        '<button class="btn primary" data-act="close-piece">Back to Pieces</button>'+
      '</div></div>';
    foot='';
  } else {
    var pct=Math.round(piecePercentCut(st));
    stage='<div class="trace-stage"><canvas class="cutc" id="trace-canvas" data-part="'+pid+'"></canvas></div>';
    foot='<div class="trace-foot">'+
        '<div class="chip-label">cut around the guide lines</div>'+
        '<div class="prog"><i style="width:'+pct+'%"></i></div>'+
        '<div class="chip-label" id="trace-pct">'+pct+'% cut</div>'+
        '<button class="btn inline" data-act="reset-trace" data-part="'+pid+'">Start Over</button>'+
      '</div>';
  }

  return '<div class="trace-wrap" style="background-image:url('+SCENE_IMG+');">'+
      req + fabricZone + stage + foot +
    '</div>';
}

function bodyCustom(){
  var g=state.guest;
  var chips=g.wantColors.map(function(cid){
    if (cid==='any') return '<span class="pref-chip sm">Any color</span>';
    var c=COLORS.filter(function(x){ return x.id===cid; })[0];
    return '<span class="pref-chip sm"><span class="dot" style="background:'+c.hex+'"></span>'+c.name+'</span>';
  }).join('');

  var list;

    list='<div class="empty">No pieces yet. Add at least one item to build this outfit.</div>';

      return '<div class="ci-row">'+

        '<div class="ci-txt"><b>'+esc(it.name)+'</b>'+
          '<small>'+f.colorName+' '+f.patternName+' &middot; '+it.yards.toFixed(2)+' yd &middot; '+money(it.cost)+

      '<div class="rs-line"><span class="rs-k">Colors</span><span class="rs-v">'+chips+'</span></div>'+
      '<div class="rs-line"><span class="rs-k">Budget</span><span class="rs-v rs-budget">'+money(g.budget)+'</span></div>'+
    '</div>'+
    '<div class="hint" style="margin-top:0;">Design it however you like. Add a piece, choose cloth, and cut any shape you want.</div>'+

    '<button class="btn primary" data-act="add-item">+ Add Item</button>'+
    '<button class="btn good" data-act="custom-proceed" '+(n?'':'disabled')+'>'+sellLabel+'</button>'+
    '<button class="btn" data-act="abandon">Abandon This Order</button>';

function bodyCustomAssembly(){
  if (!state.customArrange) initCustomArrange();
  var arr=state.customArrange;

  var pieces=state.customItems.map(function(it){
    var pos=arr.pos[it.id];
    var w=it.bw*CUSTOM_SCALE, h=it.bh*CUSTOM_SCALE;
    return '<div class="apiece" data-cust="'+it.id+'" '+
      'style="left:'+pos.x+'px; top:'+pos.y+'px; width:'+w+'px; height:'+h+'px; '+
      'z-index:'+customZ(it.id)+'; '+tfStyle(it.id)+'">'+
      piecePolySVG(it.fabricId, it.cutShape, w, h, 2)+

  }).join('');

  var layers=arr.order.map(function(id,i){
    var it=customItemById(id); if(!it) return '';
    var f=fabricById(it.fabricId);
    return '<div class="lp-item" data-layer="'+id+'" style="top:'+(i*38)+'px;" title="'+esc(it.name)+'">'+
      '<span class="lp-sw" style="background:'+swatchBg(f)+'"></span>'+

    '<button class="btn" data-act="back-to-custom">Back to Items</button>';

function bodyAssembly(){
  var g=state.guest;
  var slots=g.garment.parts.map(function(p){
    var l=layoutFor(g.garment.id,p.id);
    return '<div class="slot" style="left:'+l.x+'px; top:'+l.y+'px; width:'+l.w+'px; height:'+l.h+'px; clip-path:'+shapeClip(p.shape)+';">'+p.label+'</div>';
  }).join('');
  var pieces=g.garment.parts.map(function(p){
    var l=layoutFor(g.garment.id,p.id), st=state.cutting[p.id];
    var placed=state.assembly.placed[p.id], pos=state.assembly.positions[p.id];
    /* render the outline the player actually cut, not the ideal pattern */
    var box=fitCutBox(l, st.cutAspect);
    var pts=st.cutShape && st.cutShape.length>2 ? st.cutShape : shapePoints(p.shape);
    return '<div class="apiece'+(placed?' locked':'')+'" data-part="'+p.id+'" '+
      'style="left:'+(pos.x+box.dx)+'px; top:'+(pos.y+box.dy)+'px; width:'+box.w+'px; height:'+box.h+'px; '+
      'z-index:'+(placed?l.z:10)+';">'+
      piecePolySVG(st.fabricId, pts, box.w, box.h, 2)+
      '<span class="tg">'+p.label+'</span></div>';
  }).join('');
  return '<div class="hint" style="margin-top:0;">Drag each cut piece into its dashed outline.</div>'+
    '<div class="asm-stage" id="asm-stage">'+slots+pieces+'</div>'+
    '<button class="btn primary" data-act="proceed-asm" '+(assemblyAllPlaced()?'':'disabled')+'>Continue to Pricing</button>';
}

/* Free arrangement: pieces go anywhere, no slots and no snapping.
   Move: drag. Resize: pinch, or wheel while holding the piece.
   Rotate: twist two fingers, or right-drag. */
/* The stage stretches to whatever width is free; the fixed 250x380 coordinate
   space is scaled to fill it, so positions stay exact at any size. */
function fitCustomStage(stage){
  var inner=stage.querySelector('.cstage-inner');
  if (!inner) return;
  var w=stage.clientWidth||CSTAGE_W;
  var k=clamp(w/CSTAGE_W, 0.5, 1.4);
  inner.style.transform='scale('+k+')';
  stage.style.height=Math.round(CSTAGE_H*k)+'px';
}

function initCustomArrangeDrag(stage){
  var inner=stage.querySelector('.cstage-inner') || stage;
  var pointers={};          /* live pointers, by id */
  var mode=null;            /* 'move' | 'rotate' | 'gesture' */
  var activeId=null;        /* the piece being manipulated */
  var gesture=null;         /* pinch/twist reference values */
  var rotate=null;          /* right-drag reference values */

  function stageScale(){
    var r=inner.getBoundingClientRect();
    return { r:r, sx:CSTAGE_W/(r.width||CSTAGE_W), sy:CSTAGE_H/(r.height||CSTAGE_H) };
  }
  function toStage(e){
    var g=stageScale();
    return { x:(e.clientX-g.r.left)*g.sx, y:(e.clientY-g.r.top)*g.sy };
  }
  function elFor(id){ return inner.querySelector('.apiece[data-cust="'+id+'"]'); }
  function sizeOf(id){
    var it=customItemById(id);
    return it ? { w:it.bw*CUSTOM_SCALE, h:it.bh*CUSTOM_SCALE } : { w:0, h:0 };
  }
  function centerOf(id){
    var p=state.customArrange.pos[id], s=sizeOf(id);
    return { x:p.x+s.w/2, y:p.y+s.h/2 };
  }
  function applyStyle(id){
    var el=elFor(id); if(!el) return;
    var p=state.customArrange.pos[id], t=getTF(id);
    el.style.left=p.x+'px'; el.style.top=p.y+'px';
    el.style.transform='rotate('+t.r.toFixed(1)+'deg) scale('+t.s.toFixed(3)+')';
  }
  function livePointers(){
    var out=[]; for (var k in pointers) out.push(pointers[k]); return out;
  }

  Array.prototype.forEach.call(inner.querySelectorAll('.apiece'), function(el){
    var id=el.getAttribute('data-cust');

    el.addEventListener('pointerdown', function(e){
      e.preventDefault();
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
      var p=toStage(e);
      pointers[e.pointerId]={ id:id, x:p.x, y:p.y, cx:e.clientX, cy:e.clientY };

      /* right button starts a rotation drag */
      if (e.button===2){
        activeId=id; mode='rotate';
        var c=centerOf(id);
        rotate={ startAngle:Math.atan2(p.y-c.y, p.x-c.x)*180/Math.PI, startRot:getTF(id).r };
        return;
      }

      var mine=livePointers().filter(function(q){ return q.id===id; });
      if (mine.length>=2){
        /* two fingers on the same piece: pinch to resize, twist to rotate */
        activeId=id; mode='gesture';
        var a=mine[0], b=mine[1], t=getTF(id);
        gesture={
          startDist:Math.max(1,Math.hypot(a.x-b.x, a.y-b.y)),
          startAngle:Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI,
          startScale:t.s, startRot:t.r
        };
        state.customArrange.dragging=null;
        return;
      }

      activeId=id; mode='move';
      state.customArrange.dragging=id;
      var pos=state.customArrange.pos[id];
      state.customArrange.ox=p.x-pos.x;
      state.customArrange.oy=p.y-pos.y;
    });

    /* wheel while holding the piece resizes it */
    el.addEventListener('wheel', function(e){
      if (state.customArrange.dragging!==id) return;
      e.preventDefault();
      var t=getTF(id);
      t.s=clamp(t.s * (e.deltaY<0 ? 1.08 : 1/1.08), 0.3, 3);
      applyStyle(id);
    }, { passive:false });
  });

  stage.addEventListener('pointermove', function(e){
    if (!pointers[e.pointerId] && mode!=='rotate') return;
    e.preventDefault();
    var p=toStage(e);
    if (pointers[e.pointerId]){
      pointers[e.pointerId].x=p.x; pointers[e.pointerId].y=p.y;
      pointers[e.pointerId].cx=e.clientX; pointers[e.pointerId].cy=e.clientY;
    }

    if (mode==='gesture' && activeId){
      var mine=livePointers().filter(function(q){ return q.id===activeId; });
      if (mine.length<2) return;
      var a=mine[0], b=mine[1], t=getTF(activeId);
      var dist=Math.max(1,Math.hypot(a.x-b.x, a.y-b.y));
      var ang=Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI;
      t.s=clamp(gesture.startScale*(dist/gesture.startDist), 0.3, 3);
      t.r=gesture.startRot+(ang-gesture.startAngle);
      applyStyle(activeId);
      return;
    }

    if (mode==='rotate' && activeId){
      var c=centerOf(activeId), tr=getTF(activeId);
      var a2=Math.atan2(p.y-c.y, p.x-c.x)*180/Math.PI;
      tr.r=rotate.startRot+(a2-rotate.startAngle);
      applyStyle(activeId);
      return;
    }

    var id=state.customArrange.dragging;
    if (mode==='move' && id){
      var sz=sizeOf(id);
      var x=clamp(p.x-state.customArrange.ox, -sz.w*0.4, CSTAGE_W-sz.w*0.6);
      var y=clamp(p.y-state.customArrange.oy, -sz.h*0.4, CSTAGE_H-sz.h*0.6);
      state.customArrange.pos[id]={x:x,y:y};
      applyStyle(id);
    }
  });

  function release(e){
    if (e && pointers[e.pointerId]) delete pointers[e.pointerId];
    var remaining=livePointers();
    if (mode==='gesture' && remaining.filter(function(q){ return q.id===activeId; }).length<2){
      mode=remaining.length?'move':null;
      if (mode==='move'){
        /* keep dragging with the finger that is still down */
        var q=remaining[0];
        state.customArrange.dragging=q.id; activeId=q.id;
        var pos=state.customArrange.pos[q.id];
        state.customArrange.ox=q.x-pos.x; state.customArrange.oy=q.y-pos.y;
      }
    }
    if (!remaining.length){
      mode=null; activeId=null; gesture=null; rotate=null;
      state.customArrange.dragging=null;
    }
  }
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  /* right-drag is a rotate gesture, so suppress the browser menu here */
  stage.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

/* Layer list: drag a row up or down to change what sits in front. */
var LP_ROW=38;
function initLayerDrag(list){
  Array.prototype.forEach.call(list.querySelectorAll('.lp-item'), function(el){
    el.addEventListener('pointerdown', function(e){
      e.preventDefault();
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
      var order=state.customArrange.order;
      var id=el.getAttribute('data-layer');
      var startIndex=order.indexOf(id);
      var startY=e.clientY, curIndex=startIndex;
      el.classList.add('dragging');

      function move(ev){
        var dy=ev.clientY-startY;
        var shift=Math.round(dy/LP_ROW);
        var ni=clamp(startIndex+shift, 0, order.length-1);
        el.style.transform='translateY('+dy+'px)';
        if (ni!==curIndex){
          curIndex=ni;
          /* nudge the other rows to preview the new stacking */
          Array.prototype.forEach.call(list.querySelectorAll('.lp-item'), function(o){
            if (o===el) return;
            var oi=order.indexOf(o.getAttribute('data-layer'));
            var off=0;
            if (startIndex<curIndex && oi>startIndex && oi<=curIndex) off=-LP_ROW;
            else if (startIndex>curIndex && oi<startIndex && oi>=curIndex) off=LP_ROW;
            o.style.transform='translateY('+off+'px)';
          });
        }
      }
      function up(){
        el.releasePointerCapture && el.pointerId;
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        document.removeEventListener('pointercancel', up);
        if (curIndex!==startIndex){
          order.splice(startIndex,1);
          order.splice(curIndex,0,id);
        }
        renderModal();
      }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
      document.addEventListener('pointercancel', up);
    });
  });
}

/* How large the finished piece is drawn in each context. The art auto-scales
   to fill and centre within these boxes, so a single small piece and a full
   multi-piece outfit both read at a comfortable size. */
var ART_TARGET_PRICE = { w:212, h:300, pad:20 };   /* Set Your Price / Result */
var ART_TARGET_CAT   = { w:150, h:150, pad:12 };   /* catalog exclusive thumbnail */

/* Scale + translate the piece layer so the pieces' bounding box fills the
   target box (preserving aspect) and sits dead-centre. */
function fitArtTransform(rects, target){
  if (!rects.length) return '';
  var minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  for (var i=0;i<rects.length;i++){
    var r=rects[i];
    if (r.x<minX) minX=r.x;
    if (r.y<minY) minY=r.y;
    if (r.x+r.w>maxX) maxX=r.x+r.w;
    if (r.y+r.h>maxY) maxY=r.y+r.h;
  }
  var bw=Math.max(1,maxX-minX), bh=Math.max(1,maxY-minY);
  var pad=target.pad||0;
  var s=Math.min((target.w-pad)/bw, (target.h-pad)/bh);
  var tx=(target.w-bw*s)/2 - minX*s;
  var ty=(target.h-bh*s)/2 - minY*s;
  return 'transform:translate('+tx.toFixed(2)+'px,'+ty.toFixed(2)+'px) scale('+s.toFixed(4)+'); transform-origin:0 0;';
}
function artBoxHTML(rects, pieceHtml, extraClass, target){
  return '<div class="art-box'+(extraClass?' '+extraClass:'')+'" style="width:'+target.w+'px; height:'+target.h+'px;">'+
    '<div class="art-in" style="'+fitArtTransform(rects, target)+'">'+pieceHtml+'</div></div>';
}

/* Custom outfits are drawn from the player's own arrangement. */
function customArt(cg, target){
  target=target||ART_TARGET_PRICE;
  if (!state.customArrange) initCustomArrange();
  var arr=state.customArrange, rects=[];
  var html=state.customItems.map(function(it){
    var pos=arr.pos[it.id];
    var w=it.bw*CUSTOM_SCALE, h=it.bh*CUSTOM_SCALE;
    rects.push({x:pos.x, y:pos.y, w:w, h:h});
    return '<div class="art-p" style="left:'+pos.x+'px; top:'+pos.y+'px; width:'+w+'px; height:'+h+'px; '+
      'z-index:'+customZ(it.id)+'; '+tfStyle(it.id)+'">'+
      piecePolySVG(it.fabricId, it.cutShape, w, h, 2)+'</div>';
  }).join('');
  return artBoxHTML(rects, html, 'cart', target);
}

function garmentArt(cg, target){
  target=target||ART_TARGET_PRICE;
  if (cg.custom) return customArt(cg, target);
  var g=garmentTypeById(cg.garmentId), rects=[];
  var html=cg.parts.map(function(p){
    var l=layoutFor(g.id,p.id), def=partOf(g,p.id);
    /* the finished garment is made of the shapes the player actually cut */
    var box=fitCutBox(l, p.cutAspect);
    var x=l.x+box.dx, y=l.y+box.dy;
    rects.push({x:x, y:y, w:box.w, h:box.h});
    var pts=p.cutShape && p.cutShape.length>2 ? p.cutShape : shapePoints(def.shape);
    return '<div class="art-p" style="left:'+x+'px; top:'+y+'px; '+
      'width:'+box.w+'px; height:'+box.h+'px; z-index:'+l.z+';">'+
      piecePolySVG(p.fabricId, pts, box.w, box.h, 2)+'</div>';
  }).join('');
  return artBoxHTML(rects, html, '', target);
}

function bodyPricing(){
  var g=state.guest, cg=state.cutGarment, fp=Math.round(fairPrice());
  var isCat=g.catalogDesign, help=settings.sellingHelp;
  var max=isCat ? Math.max(Math.round(fp*2),10) : Math.max(Math.round(g.budget*1.4), Math.round(fp*1.5), 10);

  /* wrap a value in a colour cue only when Selling Help is on */
  function cue(txt, color){ return help ? '<b style="color:'+color+'">'+txt+'</b>' : '<b>'+txt+'</b>'; }

  /* quality / precision (or, for custom pieces, the palette-match line) */
  var qualLine;
  if (cg.custom){
    qualLine='Design work <b>'+money(cg.labor||0)+'</b><br>Pieces <b>'+(cg.itemCount||cg.parts.length)+'</b>'+
      ' &middot; Palette match '+cue(Math.round(cg.quality)+'%', qualityColor(cg.quality))+'<br>';
  } else {
    qualLine='Match quality '+cue(Math.round(cg.quality)+'%', qualityColor(cg.quality))+
      ' &middot; Precision '+cue(Math.round(cg.precisionAvg)+'%', precisionColor(cg.precisionAvg))+'<br>';
  }

  var budgetLine = isCat ? '' : 'Guest budget <b>'+money(g.budget)+'</b>';
  var priceStyle = help ? ' style="color:'+priceIndicatorColor()+'"' : '';

  /* hint text: only the Selling Help legend, or the catalog note; otherwise nothing */
  var hint='';
  if (isCat) hint='Set the shelf price for this exclusive. Guests who request it will pay up to their own budget.';
  else if (help) hint='Colour cues show your odds: <b style="color:var(--good)">green</b> likely sale, '+
    '<b style="color:var(--brass)">yellow</b> risky, <b style="color:var(--bad)">red</b> won&rsquo;t sell.';

  var foot=isCat
    ? '<button class="btn good" data-act="add-exclusive">Add to Exclusive Catalog</button>'
    : '<button class="btn good" data-act="present">Present to '+esc(g.name)+'</button>'+
      '<button class="btn" data-act="add-exclusive">Add to Exclusive Catalog</button>';

  return garmentArt(cg)+
    '<div class="price-line">'+
      'Material cost <b>'+money(cg.cost)+'</b><br>'+
      'Fair price <b>'+money(fp)+'</b><br>'+
      qualLine+
      budgetLine+
    '</div>'+
    '<div class="price-row">'+
      '<input type="range" min="1" max="'+max+'" step="1" value="'+state.price+'" data-act="price">'+
      '<div class="price-val"'+priceStyle+'>'+money(state.price)+'</div>'+
    '</div>'+
    (hint?'<div class="hint">'+hint+'</div>':'')+
    foot;
}

  if (veil){
    /* tapping the dimmed area closes only light-weight modals */
    var m=state.ui.modal;
    if (m==='shop'||m==='clearance'||m==='ticket'||m==='menu'||m==='gameplay'){ state.ui.modal=null; renderModal(); }
    return;
  }
  var el=e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var act=el.getAttribute('data-act');
  var id=el.getAttribute('data-id');
  var part=el.getAttribute('data-part');

  switch(act){
    case 'menu': state.ui.modal='menu'; renderModal(); break;
    case 'gameplay': state.ui.modal='gameplay'; renderModal(); break;
    case 'toggle-patience':
      settings.patience=!settings.patience; saveSettings();
      renderModal(); renderTray();
      toast('Guest patience '+(settings.patience?'on':'off')+'.');
      break;
    case 'toggle-selling':
      settings.sellingHelp=!settings.sellingHelp; saveSettings();
      renderModal();
      toast('Selling help '+(settings.sellingHelp?'on':'off')+'.');
      break;
    case 'toggle-precision':
      settings.precisionMatters=!settings.precisionMatters; saveSettings();
      renderModal();
      toast('Precision matters '+(settings.precisionMatters?'on':'off')+'.');
      break;
    case 'close-modal':
      if (state.ui.modal==='trace'){ state.ui.modal='cutting'; state.ui.tracePart=null; }
      else if (state.ui.modal==='customcut'){ state.customDraft=null; state.ui.modal='custom'; }
      else if (state.ui.modal==='customasm'){ state.ui.modal='custom'; }
      else if (state.ui.modal==='gameplay'){ state.ui.modal='menu'; }
      else if (state.ui.modal==='custom'){
        if (state.guest && state.guest.catalogDesign){ endCatalogDesign(); state.ui.modal='catalog'; state.ui.catalogTab='ex'; }
        else state.ui.modal=null;
      }
      else if (state.ui.modal==='pricing' && state.guest && state.guest.catalogDesign){ state.ui.modal='custom'; }
      else if (state.ui.modal==='summary'){ /* summary must be acknowledged */ }
      else if (state.ui.modal==='result'){ finishOrder(); return; }
      else if (state.ui.modal==='cutting'||state.ui.modal==='assembly'||state.ui.modal==='pricing'){ state.ui.modal=null; }
      else state.ui.modal=null;
      renderModal(); break;

    case 'shop': state.ui.modal='shop'; renderModal(); break;
    case 'shop-color': state.ui.shopColor=(state.ui.shopColor===id?null:id); renderModal(); break;
    case 'clearance': state.ui.modal='clearance'; state.ui.donateMode=false; state.ui.donateSel=[]; renderModal(); break;
    case 'buy': buyFabric(id,2); state.ui.modal='shop'; renderModal(); break;
    case 'sell-item': sellRackItem(id); state.ui.modal='clearance'; renderModal(); break;
    case 'recycle-item': recycleRackItem(id); state.ui.modal='clearance'; renderModal(); break;
    case 'sell-all': sellAllRack(); state.ui.modal='clearance'; renderModal(); break;
    case 'donate-start': state.ui.donateMode=true; state.ui.donateSel=[]; renderModal(); break;
    case 'donate-toggle': toggleDonate(id); break;
    case 'donate-confirm': confirmDonate(); break;
    case 'donate-cancel': state.ui.donateMode=false; state.ui.donateSel=[]; renderModal(); break;

    case 'catalog': state.ui.modal='catalog'; state.ui.catalogTab=state.ui.catalogTab||'std'; renderModal(); break;
    case 'catalog-tab': state.ui.catalogTab=id; renderModal(); break;
    case 'toggle-offering': toggleOffering(id); break;
    case 'design-exclusive': startCatalogDesign(); break;
    case 'remove-exclusive': removeExclusive(id); break;
    case 'rename-exclusive': renameExclusive(id); break;
    case 'add-exclusive': addExclusive(); break;

    case 'open-store': openStore(); break;
    case 'ticket': state.ui.modal='ticket'; state.ui.modalId=id; renderModal(); break;
    case 'accept': acceptTicket(id); break;
    case 'decline': declineTicket(id); break;
    case 'resume': state.ui.modal=state.guest.exclusiveId?'pricing':(isCustom()?'custom':'cutting'); renderModal(); break;

    case 'add-item': startCustomItem(); break;
    case 'pick-custom-fabric': pickCustomFabric(id); break;
    case 'reset-custom-cut': resetCustomCut(); break;
    case 'finish-item': finishCustomItem(); break;
    case 'remove-item': removeCustomItem(id); break;
    case 'custom-proceed': proceedCustom(); break;
    case 'custom-asm-done': proceedCustomAssembly(); break;
    case 'back-to-custom': state.ui.modal='custom'; renderModal(); break;
    case 'open-piece':
      state.ui.tracePart=part;
      state.ui.fabricOpen=!(state.cutting[part] && state.cutting[part].fabricId);
      state.ui.modal='trace';
      renderModal(); break;
    case 'toggle-fabric': state.ui.fabricOpen=!state.ui.fabricOpen; renderModal(); break;
    case 'close-piece': state.ui.modal='cutting'; state.ui.tracePart=null; renderModal(); break;
    case 'pick-fabric': selectFabricForPart(part,id); break;
    case 'reset-trace': resetPieceTrace(part); break;
    case 'proceed-cut': proceedFromCutting(); break;
    case 'proceed-asm': proceedFromAssembly(); break;
    case 'present': presentToGuest(); break;
    case 'finish-order': finishOrder(); break;
    case 'abandon':
      if (state.guest && state.guest.catalogDesign){
        endCatalogDesign();
        state.ui.modal='catalog'; state.ui.catalogTab='ex';
        toast('Design discarded.');
        renderAll();
        break;
      }
      state.guest=null; state.cutting={}; state.assembly=null;
      state.customItems=[]; state.customDraft=null; state.customArrange=null;
      state.ui.modal=null; state.reputation=clamp(state.reputation-2,0,100);
      toast('Order abandoned.');
      if (state.closingPending) endDay(); else renderAll();
      break;

    case 'next-day': nextDay(); break;
    case 'save': saveGame(); if (state.ui.modal==='menu') renderModal(); break;
    case 'load': loadGame(); break;
    case 'new-game': newGame(); break;
  }
});

document.addEventListener('input', function(e){
  var a=e.target.getAttribute && e.target.getAttribute('data-act');
  if (a==='day-length'){
    settings.dayMinutes=clamp(parseInt(e.target.value,10)||5,1,60);
    var lv=document.getElementById('daylen-val');
    if (lv) lv.textContent=settings.dayMinutes+' minute'+(settings.dayMinutes===1?'':'s')+' per day';
    saveSettings();
    return;
  }
  if (a==='item-name'){
    if (state.customDraft) state.customDraft.name=e.target.value;
    return;
  }
  if (e.target.getAttribute && e.target.getAttribute('data-act')==='price'){
    state.price=parseInt(e.target.value,10);
    var v=document.querySelector('.price-val');
    if (v){
      v.textContent=money(state.price);
      if (settings.sellingHelp) v.style.color=priceIndicatorColor();
    }
  }
});

/* keep the trace canvas and the scene stage correctly sized on rotation / resize */
window.addEventListener('resize', function(){
  fitScene();
  var cs=document.getElementById('cust-stage');
  if (cs) fitCustomStage(cs);
  if (state.ui.modal==='trace') renderModal();
});
window.addEventListener('orientationchange', function(){
  setTimeout(function(){ fitScene(); if (state.ui.modal==='trace') renderModal(); }, 120);
});

/* ============================= INIT ============================= */

loadSettings();
renderAll();

})();
</script>
</body>
</html>
